<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff0000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff0000'/%3E%3Crect x='9' y='7' width='7' height='18' fill='%23fff'/%3E%3C/svg%3E">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typewriter">
<script src="config.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol==="https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<title>Abisso Typewriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: writing desk — app chrome around a single page of paper; breakdown view swaps the desk for strip-board rows */
/* Layout: carta bianca e inchiostro nero, con il rosso pieno del sito abissostudio.it come unico accento; la pagina del copione al centro con un bordo sottile. Pagina scura opzionale per scrivere di notte. */
:root{
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f4f4f5; --paper:#ffffff; --ink:#000000; --muted:#6b6b70; --line:#e1e1e5;
  --red:#ff0000; --red-ink:#d90000; --accent:#ff0000; --accent-ink:#ffffff; --accent-soft:#ffecec; --mark:#d90000;
  --s-intd:#ffffff; --s-extd:#ffa3a3; --s-intn:#6b6b70; --s-extn:#000000; --danger:#d90000; --desk:#e9e9ed;
  --f-ui:Helvetica, Arial, sans-serif;
  --f-script:"Courier Prime", "Courier New", Courier, monospace;
  --lh:1.2em; --r:10px; --zoom:1;
  --shadow:0 0 0 1px #e1e1e5, 0 10px 30px rgba(0,0,0,.06);
  color-scheme:light;
}
html.mode-dark{
  --bg:#0b051d; --panel:#100728; --panel-2:#1b1140; --paper:#170d36; --ink:#ffffff; --muted:#a79dc2; --line:#2f2456;
  --red:#ff0000; --red-ink:#ff4040; --accent:#ff0000; --accent-ink:#ffffff; --accent-soft:#2a1b52; --mark:#ff4040;
  --s-intd:#ffffff; --s-extd:#ff8080; --s-intn:#6c5ca0; --s-extn:#ff0000; --danger:#ff4040; --desk:#06020f;
  --shadow:0 0 0 1px #2f2456, 0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}


html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.tb.cycle{color:var(--red-ink);border-color:var(--red)}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
.app > .top{grid-row:1}.app > .typebar{grid-row:2}.app > .main{grid-row:3}.app > .status{grid-row:4}

/* header */
.top{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:2px solid var(--red);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:center;gap:0;white-space:nowrap;flex:none;font-family:var(--f-script);font-size:15px;letter-spacing:.06em;color:var(--ink);line-height:1}
.brand .w1{font-weight:700;color:var(--red-ink)}
.brand .w2{margin-left:.6em}
.brand .cur{display:inline-block;width:.55em;height:1.05em;background:var(--red);margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.brand .cur{animation:none}}
.title-input{flex:1 1 160px;min-width:0;max-width:360px;border:1px solid transparent;background:transparent;border-radius:0;padding:6px 8px;font-weight:700;font-size:15px}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);background:var(--paper);outline:none}
.spacer{flex:1}
.btn{border:1.5px solid var(--ink);color:var(--ink);background:var(--panel);border-radius:var(--r);padding:7px 12px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn.primary{background:var(--red);color:var(--accent-ink);border-color:var(--red);font-weight:700}
.btn.primary:hover{background:var(--panel);color:var(--red)}
.btn.icon{padding:5px 10px;line-height:1;font-size:14px;letter-spacing:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.title-input:focus{background:var(--panel-2)!important}

/* type bar */
.typebar{display:flex;align-items:center;gap:4px;background:var(--panel-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.typebar::-webkit-scrollbar{display:none}
.tb{flex:none;border:1px solid transparent;background:transparent;border-radius:0;padding:5px 9px;display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tb:hover{background:var(--panel)}
.tb{border-radius:8px}
.tb.on{background:var(--red);border-color:var(--red);color:var(--accent-ink)}
.tb.on kbd{color:var(--accent-ink);border-color:var(--accent-ink);background:transparent}
.tb.on .dot{background:var(--accent-ink)}
.tb .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
kbd{font-family:var(--f-ui);font-size:10px;letter-spacing:0;color:var(--muted);border:1px solid var(--line);padding:0 4px;background:var(--panel)}
.tb-sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 4px}
.only-m{display:none}

/* main */
.main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-tabs{display:flex;gap:2px;padding:10px 12px 6px}
.side-tabs button{flex:1;border:0;border-bottom:2px solid var(--line);background:transparent;padding:8px 6px;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.side-tabs button.on{border-bottom-color:var(--red);color:var(--ink)}
.side-list{overflow:auto;padding:4px 8px 16px;flex:1;min-height:0}
.sc{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 6px}
.sc:hover{background:var(--panel-2)}
.sc.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--red)}
.sc.cur .n{color:var(--red-ink)}
.sc .n{font-family:var(--f-script);font-weight:700;color:var(--muted);text-align:right}
.sc .h{min-width:0}
.sc .h b{display:block;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .h i{font-style:normal;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.sc .pg{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty-note{color:var(--muted);padding:12px 8px;font-size:13px;line-height:1.5}

/* editor */
.write{min-height:0;position:relative}
.scroller{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.paper{position:relative;margin:32px auto 140px;font-size:calc(15.5px * var(--zoom))!important;width:85ch;max-width:calc(100% - 32px);background:var(--paper);color:var(--ink);
  font-family:var(--f-script);font-size:15.5px;line-height:var(--lh);padding:6em 10ch 8em 15ch;box-shadow:var(--shadow);border-radius:2px}
#ed{outline:none;counter-reset:sc;caret-color:var(--red);min-height:30em}
.el{position:relative;white-space:pre-wrap;overflow-wrap:break-word;min-height:var(--lh)}
.el + .el{margin-top:var(--lh)}
.el.t-s{text-transform:uppercase;counter-increment:sc}
#ed.sp2 .el.t-s:not(:first-child){margin-top:calc(var(--lh) * 2)}
#ed.bold .el.t-s{font-weight:700}
#ed.nums .el.t-s::after{content:counter(sc);position:absolute;left:-6ch;top:0;color:var(--mark);font-weight:700}
.el.t-c{margin-left:22ch;text-transform:uppercase}
.el.t-p{margin-left:15ch;max-width:25ch}
.el.t-d{margin-left:10ch;max-width:35ch}
.el.t-c + .el.t-d,.el.t-c + .el.t-p,.el.t-p + .el.t-d,.el.t-d + .el.t-p,.el.t-p + .el.t-p,.el.t-d + .el.t-d{margin-top:0}
.el.t-t{text-align:right;text-transform:uppercase}
.el.t-h{text-transform:uppercase}
.el.ph::before{content:attr(data-ph);position:absolute;left:0;top:0;color:var(--muted);opacity:.55;pointer-events:none;text-transform:none;white-space:nowrap}
.el.t-t.ph::before{left:auto;right:0}
.marks{position:absolute;inset:0;pointer-events:none;z-index:0}
#ed{position:relative;z-index:1}
/* page view: real sheets, gaps between pages */
.write.pages .scroller{background:var(--desk)}
.write.pages .paper{--lh:1em;box-sizing:border-box;width:var(--pw,85ch);max-width:none;background:transparent;box-shadow:none;border-radius:0;line-height:1em;
  font-size:calc(16px * var(--zoom))!important;padding:6em calc(var(--pw,85ch) - 75ch) 0 15ch;margin:24px auto 40vh}
.write.pages .shbar{margin-bottom:0}
.sheet{position:absolute;left:0;right:0;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
html.mode-dark .sheet{box-shadow:0 0 0 1px var(--line)}
.pnum,.plab{position:absolute;white-space:pre;font-family:var(--f-script);color:var(--ink);line-height:1em}
.pnum{color:var(--muted)}
.plab{color:var(--muted)}
.pgap{display:block;pointer-events:none;user-select:none}
.tb.on-mode{color:var(--red-ink);border-color:var(--red)}
.pm{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.pm span{position:absolute;right:10px;top:-.65em;background:var(--paper);color:var(--mark);font-family:var(--f-ui);font-size:10px;font-weight:700;padding:0 4px;letter-spacing:.04em}

.ac{position:absolute;z-index:5;min-width:220px;max-width:min(360px,90%);background:var(--panel);color:var(--ink);border:1px solid var(--red);border-radius:8px;box-shadow:var(--shadow);padding:4px;font-family:var(--f-script);font-size:14px}
.ac button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac button.sel{background:var(--red);color:#ffffff}

/* status */
.status{display:flex;gap:16px;align-items:center;background:var(--panel);border-top:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));white-space:nowrap;overflow:hidden}
.status .save{margin-left:auto;display:flex;gap:6px;align-items:center}
.status .save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.status .save.err{color:var(--red-ink)}
.status .save.err::before{border-color:var(--red)!important}
.status .save.busy::before{background:transparent;border:1px solid var(--ink);box-sizing:border-box}
.status .save.local::before{background:var(--muted)}
.status .save.err::before{background:transparent;border:2px solid var(--ink);border-radius:0;box-sizing:border-box}
.status .save.err{color:var(--ink);font-weight:700}

/* breakdown */
.bd{min-height:0;overflow:auto;grid-column:1 / -1}
.bd-in{max-width:1100px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bd-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bd-head h2{margin:0;color:var(--red-ink);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-right:auto;text-wrap:balance}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig{background:var(--panel);padding:10px 12px}
.fig b{display:block;color:var(--red-ink);font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-weight:700}
.fig span{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.ai-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px}
.ai-bar p{margin:0;flex:1 1 260px;color:var(--muted);line-height:1.45;min-width:0}
.prog{height:3px;background:var(--line);overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.bd-tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.bd-tabs button{border:0;background:transparent;padding:9px 12px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.bd-tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.bd-tabs select{margin-left:auto;border:1.5px solid var(--ink);background:var(--panel);border-radius:8px;padding:5px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:10px;border:1px solid var(--muted)}
.strips{display:flex;flex-direction:column;gap:6px}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip.open{border-color:var(--red)}
.strip-row{display:grid;grid-template-columns:14px 3.2em 6.5em minmax(0,1fr) 4.5em minmax(0,1.1fr) 24px;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:0 10px 0 0;min-height:44px}
.strip-row .bar{align-self:stretch;border-right:1px solid var(--line)}
.strip-row .n{font-family:var(--f-script);font-weight:700;font-size:15px;text-align:right;color:var(--red-ink)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--ink);border-radius:4px;white-space:nowrap}
.strip-row .loc{min-width:0}
.strip-row .loc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.strip-row .loc small{color:var(--muted)}
.strip-row .e8{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.strip-row .who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.strip-row .car{color:var(--muted);transition:transform .15s}
.strip.open .car{transform:rotate(90deg)}
.strip-body{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 18px}
.cat h4{margin:0 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:4px;padding:2px 2px 2px 7px;font-size:12.5px}
.tag button{border:0;background:transparent;color:var(--muted);padding:0 5px;font-size:14px;line-height:1}
.tag-add{border:1px dashed var(--muted);background:transparent;padding:2px 6px;font-size:12px;width:9em;min-width:0}
.ai-note{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.45}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ffffff;font-weight:700;background:var(--red)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 64px);overflow:auto;background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.modal h3{margin:0 0 16px;font-size:22px;letter-spacing:-.01em;color:var(--red-ink)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 10px;font-size:16px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);outline:none}
.field textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-of-type{border-bottom:0}
.check span{flex:1}
.check small{display:block;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:6px}
.sitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.sitem.cur{border-color:var(--red)}
.sitem div{flex:1;min-width:0}
.sitem b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--muted)}
.sitem .btn{padding:5px 8px;font-size:10px}
.btn.danger{border-style:dashed}
.menu{position:fixed;z-index:21;background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:7px}
.menu button:hover{background:var(--red);color:#ffffff}
.menu button:hover small{color:#ffffff!important}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.langs{display:flex;gap:4px;padding:4px}
.langs + .langs{padding-top:0}
/* shared script bar, steps, history */
.shbar{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px}
.sh-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:5px;padding:3px 7px}
.sh-ro{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink)}
.sh-people{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.sh-p{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel-2);white-space:nowrap}
.sh-p.me{border-color:var(--ink);font-weight:700}
.sh-p:not(.me)::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#1aa34a;margin-right:6px;vertical-align:1px}
.sh-acts{display:flex;gap:6px}
.sh-btn{border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.sh-btn:hover{background:var(--ink);color:var(--bg)}
.typebar.ro{pointer-events:none;opacity:.35}

<div class="app" id="app">

"}, "Profilo su questo browser · {n} copioni": {"en": "Profile on this browser · {n} scripts", "de": "Profil in diesem Browser · {n} Drehbücher"}, "Il tuo spazio privato · {n} copioni": {"en": "Your private space · {n} scripts", "de": "Dein privater Bereich · {n} Drehbücher"}, "I miei copioni": {"en": "My scripts", "de": "Meine Drehbücher"}, "Cerca per titolo": {"en": "Search by title", "de": "Nach Titel suchen"}, "Caricamento dei copioni…": {"en": "Loading scripts…", "de": "Drehbücher werden geladen…"}, "Nessun copione con questo titolo.": {"en": "No script with that title.", "de": "Kein Drehbuch mit diesem Titel."}, "Non hai ancora copioni salvati. Creane uno nuovo o importa un file .fountain o .fdx.": {"en": "You have no saved scripts yet. Create a new one or import a .fountain or .fdx file.", "de": "Du hast noch keine gespeicherten Drehbücher. Lege ein neues an oder importiere eine .fountain- oder .fdx-Datei."}, "Preferenze": {"en": "Preferences", "de": "Einstellungen"}, "Altre persone": {"en": "Other people", "de": "Andere Personen"}, "Ogni persona che apre Abisso Typewriter con il proprio account ha un profilo e copioni suoi, che vede solo lei. La scrittura insieme sullo stesso copione non è ancora attiva.": {"en": "Everyone who opens Abisso Typewriter with their own account has their own profile and scripts, visible only to them. Writing together on the same script isn't active yet.", "de": "Jede Person, die Abisso Typewriter mit dem eigenen Konto öffnet, hat ein eigenes Profil und eigene Drehbücher, die nur sie sieht. Gemeinsames Schreiben am selben Drehbuch ist noch nicht aktiv."}, "Profilo su questo browser · 1 copione": {"en": "Profile on this browser · 1 script", "de": "Profil in diesem Browser · 1 Drehbuch"}, "Il tuo spazio privato · 1 copione": {"en": "Your private space · 1 script", "de": "Dein privater Bereich · 1 Drehbuch"}, "Condiviso": {"en": "Shared", "de": "Geteilt"}, "Solo lettura": {"en": "Read only", "de": "Nur lesen"}, "sc.": {"en": "sc.", "de": "Sz."}, "Cronologia": {"en": "History", "de": "Verlauf"}, "Link": {"en": "Link", "de": "Link"}, "Come ti chiami?": {"en": "What's your name?", "de": "Wie heißt du?"}, "Il tuo nome compare nella cronologia accanto alle modifiche che fai e accanto al tuo cursore per gli altri.": {"en": "Your name appears in the history next to your changes, and to others while you're in the script.", "de": "Dein Name erscheint im Verlauf neben deinen Änderungen und für die anderen, solange du im Drehbuch bist."}, "Nome": {"en": "Name", "de": "Name"}, "Entra": {"en": "Enter", "de": "Weiter"}, "I copioni condivisi si aprono solo dalla pagina su claude.ai, con il tuo account.": {"en": "Shared scripts open only from the page on claude.ai, with your account.", "de": "Geteilte Drehbücher öffnen sich nur auf der Seite in claude.ai, mit deinem Konto."}, "Questo copione condiviso non esiste più, oppure non hai accesso.": {"en": "This shared script no longer exists, or you don't have access.", "de": "Dieses geteilte Drehbuch existiert nicht mehr oder du hast keinen Zugriff."}, "Solo lettura: chiedi a chi ti ha mandato il link di invitarti come Editor": {"en": "Read only: ask whoever sent you the link to invite you as an Editor", "de": "Nur lesen: bitte die Person, die dir den Link geschickt hat, dich als Editor einzuladen"}, "Copione condiviso · salvataggio automatico": {"en": "Shared script · saves automatically", "de": "Geteiltes Drehbuch · speichert automatisch"}, "La condivisione funziona solo aprendo la pagina su claude.ai con il tuo account.": {"en": "Sharing works only when you open the page on claude.ai with your account.", "de": "Teilen funktioniert nur, wenn du die Seite auf claude.ai mit deinem Konto öffnest."}, "Non sono riuscito a condividere il copione. Riprova.": {"en": "Couldn't share the script. Try again.", "de": "Das Drehbuch konnte nicht geteilt werden. Versuche es erneut."}, "Condividi il copione": {"en": "Share the script", "de": "Drehbuch teilen"}, "Fatto: ora questo function parseFountain(src){
  src = String(src).replace(/\r\n?/g,"\n").replace(/\/\*[\s\S]*?\*\//g,"").replace(/\[\[[\s\S]*?\]\]/g,"");
  const lines = src.split("\n"); const tp = {}; let i = 0;

    let key = null;

      const m = l.match(/^([A-Za-z ]+):\s*(.*)$/);
      if (m && !/^\s/.test(l)){ key = m[1].toLowerCase(); tp[key] = m[2].trim(); }
      else if (key){ tp[key] = (tp[key] ? tp[key]+"\n" : "") + l.trim(); }
    }
  }
  const out = []; let inDia = false;
  const prevBlank = j => j<=0 || lines[j-1].trim()==="";
  for (; i<lines.length; i++){
    const raw = lines[i], l = raw.trim();
    if (l===""){ inDia=false; continue; }
    if (/^(#|=(?!=))/.test(l)) continue;
    if (/^={3,}$/.test(l)) continue;
    if (inDia){
      if (/^\(.*\)$/.test(l)) out.push(["p",l]); else {
        const last = out[out.length-1];
        if (last && last[0]==="d" && !/^\(/.test(l)) last[1] += "\n"+l; else out.push(["d",l]);
      }
      continue;
    }
    if (/^\.[^.]/.test(l)){ out.push(["s",l.slice(1).trim()]); continue; }
    if (SCENE_RE.test(l) && prevBlank(i)){ out.push(["s",l.replace(/\s*#[^#]*#\s*$/,"")]); continue; }
    if (/^>.*<$/.test(l)){ out.push(["a",l.slice(1,-1).trim()]); continue; }
    if (/^>/.test(l)){ out.push(["t",l.slice(1).trim()]); continue; }
    if (isUpperLine(l) && /TO:$|A:$|AUF:$|^FADE /.test(l) && prevBlank(i)){ out.push(["t",l]); continue; }
    if (/^!/.test(l)){ pushAction(l.slice(1)); continue; }
    const next = lines[i+1]; const hasNext = next!==undefined && next.trim()!=="";
    if (/^@/.test(l) && hasNext){ out.push(["c",l.slice(1).replace(/\s*\^$/,"").trim()]); inDia=true; continue; }
    if (isUpperLine(l) && prevBlank(i) && hasNext && !/[.:!?]$/.test(l.replace(/\([^)]*\)/g,"").trim()) ){ out.push(["c",l.replace(/\s*\^$/,"")]); inDia=true; continue; }
    pushAction(raw.replace(/^\s{0,}/,""));
  }
  function pushAction(t){
    const last = out[out.length-1];
    if (last && last[0]==="a" && !prevBlank(i)) last[1] += "\n"+t; else out.push(["a",t]);
  }
  return {blocks: out, tp: {title: tp.title||"", credit: tp.credit||"", author: tp.author||tp.authors||"", source: tp.source||"", draft: tp["draft date"]||"", contact: tp.contact||""}};
}
function parseFDX(src){

    const t = map[p.getAttribute("Type")] || "a";
    let txt = ""; p.querySelectorAll(":scope > Text").forEach(n => txt += n.textContent);
    txt = txt.replace(/\s+$/,"");
    if (txt || t!=="a") out.push([t, txt]);

  return {blocks: out, tp:{title}};
}
function toFountain(model, tp){
  const out = [];
  const keys = [["Title",tp.title],["Credit",tp.credit],["Author",tp.author],["Source",tp.source],["Draft date",tp.draft],["Contact",tp.contact]];
  keys.filter(k=>k[1]).forEach(([k,v]) => { if (v.includes("\n")){ out.push(k+":"); v.split("\n").forEach(x=>out.push("   "+x)); } else out.push(`${k}: ${v}`); });
  if (out.length) out.push("");
  model.forEach(([t, raw], i) => {
    const txt = String(raw).replace(/\s+$/,""); if (!txt) return;
    const nextT = (model[i+1]||[])[0];
    if (t==="s") out.push("", SCENE_RE.test(txt) ? txt.toUpperCase() : "."+txt.toUpperCase(), "");
    else if (t==="a" || t==="h"){ const x = t==="h" ? txt.toUpperCase() : txt; out.push(isUpperLine(x.split("\n")[0]) ? "!"+x : x, ""); }
    else if (t==="t"){ const u = txt.toUpperCase(); out.push(/TO:$/.test(u) ? u : "> "+u, ""); }
    else {
      if (t==="c") out.push(isUpperLine(txt) ? txt.toUpperCase() : "@"+txt);
      else if (t==="p") out.push(/^\(/.test(txt) ? txt : "("+txt+")");
      else out.push(txt);
      if (nextT!=="p" && nextT!=="d") out.push("");
    }
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim() + "\n";
}

function wrap(text, width){
  const out = [];
  for (const para of String(text).split("\n")){
    if (para===""){ out.push(""); continue; }
    const words = para.split(/ +/); let line = "";
    for (let w of words){
      while (w.length > width){ if (line){ out.push(line); line=""; } out.push(w.slice(0,width)); w = w.slice(width); }
      if (!line) line = w; else if ((line+" "+w).length <= width) line += " "+w; else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

    const [t, txt, id] = model[i];
    if (!txt.trim() && t!=="s"){ i++; continue; }
    if (t==="c" || t==="p" || t==="d"){
      let head = null, base = null;
      if (t==="c"){
        let name = txt.trim().toUpperCase(); base = charBase(name);
        if (S.contd && lastSpk===base && !/\((CONT|FORTS)/.test(name)) name += ` (${CONTD})`;
        head = L(22, name, "c", i, 0); lastSpk = base; i++;
      }
      const content = [];
      while (i<model.length && (model[i][0]==="p"||model[i][0]==="d")){
        const [tt, tx] = model[i];
        if (tx.trim()){ const w = tt==="p" ? wrap(tx.trim(),25) : wrap(tx.trim(),35);
          w.forEach((l,li) => content.push(L(tt==="p"?15:10, l, tt, i, li))); }
        i++;
      }
      units.push({kind:"speech", before:1, head, base, content, scene:curScene});
      continue;
    }
    if (t==="s"){
      sceneNo++; lastSpk = null; curScene = id || ("i"+i);
      const ls = wrap((txt.trim()||" ").toUpperCase(), 60).map((l,li) => L(0,l,"s",i,li, li===0?{sn:sceneNo}:null));
      units.push({kind:"scene", before:S.sceneSpace, lines:ls, scene:curScene});
    } else if (t==="t"){
      const ls = wrap(txt.trim().toUpperCase(),60).map((l,li)=>L(Math.max(0,60-l.length),l,"t",i,li));
      units.push({kind:"trans", before:1, lines:ls, scene:curScene});
    } else {
      const ls = wrap(t==="h"?txt.toUpperCase():txt, 60).map((l,li)=>L(0,l,t,i,li));
      units.push({kind: t==="h"?"scene":"action", before:1, lines:ls, scene:curScene});
    }
    i++;
  }
  const pages = [[]]; let y = 0; const blockPage = {}; const sceneLines = {}; const pageStarts = [null];
  const put = (ln, sc) => {
    const p = pages.length-1; ln.row = y; pages[p].push(ln);
    if (pageStarts[p]===null) pageStarts[p] = {b: ln.b, li: ln.li};
    if (ln.b!==undefined && blockPage[ln.b]===undefined) blockPage[ln.b] = p;
    y++; sceneLines[sc] = (sceneLines[sc]||0) + 1;
  };
  const newPage = () => { pages.push([]); pageStarts.push(null); y = 0; };
  const space = (n, sc) => { if (y>0){ y += n; sceneLines[sc] = (sceneLines[sc]||0)+n; } };
  const ulen = u => u.kind==="speech" ? (u.head?1:0)+u.content.length : u.lines.length;
  for (let k=0; k<units.length; k++){
    const u = units[k], sc = u.scene;
    const sp = y===0 ? 0 : u.before;
    const len = ulen(u);
    if (u.kind==="scene"){
      const nx = units[k+1]; const need = sp + len + (nx ? nx.before + Math.min(2, ulen(nx)) : 0);
      if (y>0 && y+need > LPP) newPage();
      space(u.before, sc); u.lines.forEach(l=>put(l,sc)); continue;
    }
    if (u.kind==="trans"){
      if (y>0 && y+sp+len > LPP) newPage();
      space(u.before, sc); u.lines.forEach(l=>put(l,sc)); continue;
    }
    if (u.kind==="action"){
      if (y+sp+len <= LPP){ space(u.before, sc); u.lines.forEach(l=>put(l,sc)); continue; }
      let rest = u.lines.slice(); let rem = LPP - y - sp;
      if (y>0 && (rem < 2 || rest.length - rem < 2)){ newPage(); }
      else if (y>0){ space(u.before, sc); rest.splice(0,rem).forEach(l=>put(l,sc)); newPage(); }
      while (rest.length){ const chunk = rest.splice(0, LPP - y); chunk.forEach(l=>put(l,sc)); if (rest.length) newPage(); }
      continue;
    }
    // speech
    if (y+sp+len <= LPP){ space(u.before, sc); if (u.head) put(u.head,sc); u.content.forEach(l=>put(l,sc)); continue; }
    let content = u.content.slice(); let head = u.head;
    let rem = LPP - y - sp; let avail = rem - (head?1:0) - 1;
    let kk = Math.min(avail, content.length-1);
    while (kk>0 && content[kk-1].k==="p") kk--;
    if (y>0 && (kk < 2 || content.length - kk < 1)) { newPage(); }
    else if (y>0){
      space(u.before, sc); if (head) put(head,sc);
      content.splice(0,kk).forEach(l=>put(l,sc));
      put({x:22,text:MORE,k:"more"}, sc); newPage();
      if (u.base) put({x:22,text:`${u.base} (${CONTD})`,k:"c"}, sc);
      head = null;
    }
    if (head) put(head, sc);
    while (content.length){
      const room = LPP - y - (content.length > LPP - y ? 1 : 0);
      const chunk = content.splice(0, Math.max(1,room)); chunk.forEach(l=>put(l,sc));
      if (content.length){ put({x:22,text:MORE,k:"more"},sc); newPage(); if (u.base) put({x:22,text:`${u.base} (${CONTD})`,k:"c"},sc); }
    }
  }
  if (pages.length>1 && pages[pages.length-1].length===0){ pages.pop(); pageStarts.pop(); }
  return {pages, blockPage, sceneLines, LPP, pageStarts};
}

function analyse(model, P){
  const scenes = []; let cur = null;
  model.forEach(([t, txt, id], i) => {
    if (t==="s"){ const h = parseHeading(txt); cur = {id: id||("i"+i), i, heading: txt.trim().toUpperCase(), ...h, speakers:{}, text:[], n: scenes.length+1}; scenes.push(cur); }
    else if (!cur && txt.trim()){ cur = {id:"_pre", i:0, heading:"—", ie:"", loc:"—", time:"", dn:"", speakers:{}, text:[], n:0}; scenes.push(cur); }
    if (!cur) return;
    if (t==="c"){ const b = charBase(txt); if (b) cur.speakers[b] = (cur.speakers[b]||0)+1; cur.lastSpk = b; }
    if (t!=="s" && txt.trim()) cur.text.push(t==="c" ? "\n"+txt.toUpperCase() : t==="d" ? txt : t==="p" ? txt : "\n"+txt);
  });
  const allNames = new Set(); scenes.forEach(s => Object.keys(s.speakers).forEach(n => allNames.add(n)));
  const LPP = P.LPP;
  scenes.forEach(s => {
    const body = s.text.join("\n");
    s.body = body;
    s.sig = hash(s.heading + "|" + body);
    s.e8 = Math.max(1, Math.round((P.sceneLines[s.id]||1) * 8 / LPP));
    s.page = (P.blockPage[s.i] ?? 0) + 1;
    const present = new Set(Object.keys(s.speakers));
    const actionText = body.toUpperCase();
    allNames.forEach(n => { if (!present.has(n) && n.length>1 && new RegExp("(^|[^A-ZÀ-Þ])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^A-ZÀ-Þ]|$)").test(actionText)) present.add(n); });
    s.cast = [...present];
  });
  return {scenes, names:[...allNames]};
}

/* ============ DOM model ============ */
function makeEl(t, txt, id){
  const el = document.createElement("div");
  el.className = "el t-"+t; el.dataset.t = t; el.dataset.id = id || uid();
  setText(el, txt||"");
  return el;
}
function setText(el, txt){ el.textContent = txt; if (txt==="" || txt.endsWith("\n")) el.appendChild(document.createElement("br")); }
function getText(el){ return el.textContent; }
function setType(el, t){ el.dataset.t = t; el.className = "el t-"+t; if (t==="s" && !el.dataset.id) el.dataset.id = uid(); }
function readModel(){ return [...ed.children].map(el => [el.dataset.t||"a", getText(el), el.dataset.id||""]); }
function renderModel(m){
  const f = document.createDocumentFragment();
  (m.length ? m : [["s","",""]]).forEach(([t,x,id]) => f.appendChild(makeEl(t,x,id || (t==="s"?uid():""))));
  ed.replaceChildren(f);
}
function blockOf(node){ while (node && node!==ed){ if (node.parentNode===ed) return node; node = node.parentNode; } return null; }
function caret(){
  const sel = getSelection(); if (!sel.rangeCount) return null;
  const r = sel.getRangeAt(0); const el = blockOf(r.startContainer); if (!el) return null;
  const pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  const off = pre.toString().length;
  return {el, i: [...ed.children].indexOf(el), off, collapsed: r.collapsed, len: getText(el).length};
}
function setCaret(el, off){
  const sel = getSelection(); const r = document.createRange();
  let n = 0, done = false;
  const walk = node => {
    if (done) return;
    if (node.nodeType===3){ if (n + node.length >= off){ r.setStart(node, off-n); done = true; return; } n += node.length; }
    else node.childNodes.forEach(walk);
  };
  walk(el);
  if (!done){ r.selectNodeContents(el); r.collapse(false); if (el.lastChild && el.lastChild.nodeName==="BR") r.setStartBefore(el.lastChild); }
  r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
}
function caretPos(){ const c = caret(); return c ? {i:c.i, off:c.off} : lastCaret; }
function restoreCaret(p){ const el = ed.children[Math.min(p.i, ed.children.length-1)]; if (el){ setCaret(el, Math.min(p.off, getText(el).length)); } }
function normalize(){
  for (const node of [...ed.childNodes]){
    if (node.nodeType===3){ if (!node.data.trim()) node.remove(); else { const el = makeEl("a", node.data); node.replaceWith(el); } continue; }
    if (node.nodeType!==1){ node.remove(); continue; }
    if (node.nodeName==="BR"){ node.remove(); continue; }
    if (!node.dataset.t) node.dataset.t = "a";
    const want = "el t-"+node.dataset.t + (node.classList.contains("ph")?" ph":"");
    if (node.className !== want) node.className = want;
    if (node.querySelector("div,p,span:not(.pgap),b,i,font,u,strong,em")){ const c = caret(); const t = node.textContent; setText(node, t); if (c && c.el===node) setCaret(node, c.off); }
    node.removeAttribute("style");
    if (node.textContent==="" && !node.querySelector("br")) node.appendChild(document.createElement("br"));
  }
  if (!ed.children.length) ed.appendChild(makeEl("a",""));
  const seen = new Set();
  for (const el of ed.children){
    if (!el.dataset.id || seen.has(el.dataset.id)) el.dataset.id = uid();
    seen.add(el.dataset.id);
  }
}

/* ============ history ============ */
function snap(){ return {m: readModel(), c: caretPos()}; }
function pushHist(force){
  const now = Date.now();
  if (lastSnap && (force || now - lastPushT > 900)){ undoS.push(lastSnap); if (undoS.length>300) undoS.shift(); redoS = []; }
  lastPushT = now;
}
function afterChange(){ normalize(); lastSnap = snap(); markDirty(); }
function doUndo(){ if (!undoS.length) return; redoS.push(snap()); const s = undoS.pop(); renderModel(s.m); restoreCaret(s.c); lastSnap = snap(); lastPushT = 0; markDirty(); }
function doRedo(){ if (!redoS.length) return; undoS.push(snap()); const s = redoS.pop(); renderModel(s.m); restoreCaret(s.c); lastSnap = snap(); lastPushT = 0; markDirty(); }

/* ============ editing ============ */
function doEnter(){
  const sel = getSelection(); if (sel.rangeCount && !sel.isCollapsed){ document.execCommand("delete"); normalize(); }
  const c = caret(); if (!c) return;
  const el = c.el, t = el.dataset.t, txt = getText(el);
  if (!txt.trim() || (t==="p" && txt.trim()==="()")){
    const nt = t==="a" ? "s" : (t==="p" ? "d" : "a");
    setType(el, nt); setText(el, ""); setCaret(el, 0); return;
  }
  if (t==="a" && isUpperLine(txt.trim()) && /(TO:|A:|AUF:)$/.test(txt.trim())) setType(el, "t");
  if (c.off===0){ el.before(makeEl(el.dataset.t, "")); setCaret(el, 0); return; }
  const before = txt.slice(0, c.off), after = txt.slice(c.off);
  setText(el, before);
  const nt = NEXT[el.dataset.t] || "a";
  const n = makeEl(nt, after, nt==="s" ? uid() : "");
  el.after(n); setCaret(n, 0);
  n.scrollIntoView({block:"nearest"});
}
function merge(a, b){
  if (getText(a)===""){ a.remove(); setCaret(b, 0); return; }
  const la = getText(a).length; setText(a, getText(a) + getText(b)); b.remove(); setCaret(a, la);
}
function currentBlock(){ const c = caret(); if (c) return c; const el = ed.children[Math.min(lastCaret.i, ed.children.length-1)]; return el ? {el, i:lastCaret.i, off:Math.min(lastCaret.off, getText(el).length)} : null; }
function applyType(t){
  const c = currentBlock(); if (!c) return;
  pushHist(true);
  const el = c.el, old = el.dataset.t, txt = getText(el);
  let off = c.off;
  if (t==="p" && txt.trim()===""){ setText(el, "()"); off = 1; }
  else if (t==="p" && !/^\(/.test(txt.trim())){ setText(el, "("+txt.trim()+")"); off = txt.trim().length+1; }
  else if (old==="p" && t!=="p" && /^\(.*\)$/.test(txt.trim())){ const inner = txt.trim().slice(1,-1); setText(el, inner); off = Math.min(off, inner.length); }
  setType(el, t);
  if (!ed.contains(document.activeElement) && document.activeElement!==ed) ed.focus({preventScroll:true});
  setCaret(el, Math.min(off, getText(el).length));
  afterChange(); updateCurrent(); updateAC();
}
function autoDetect(){
  const c = caret(); if (!c) return;
  const el = c.el, t = el.dataset.t, txt = getText(el);
  if (t==="a" && SCENE_RE.test(txt) && txt.length<=9 && !txt.includes("\n")){ setType(el, "s"); setCaret(el, c.off); }
  else if (t==="d" && txt==="("){ setType(el, "p"); setText(el, "()"); setCaret(el, 1); }
}

ed.addEventListener("beforeinput", e => {
  switch (e.inputType){
    case "insertParagraph": {
      e.preventDefault();
      if (!acEl.hidden && acSel >= 0){ acceptAC(acSel); return; }
      pushHist(true); doEnter(); afterChange(); updateCurrent(); updateAC(); return;
    }
    case "insertLineBreak": {
      e.preventDefault(); pushHist(true); document.execCommand("insertText", false, "\n"); afterChange(); return;
    }
    case "deleteContentBackward": {
      const c = caret();
      if (c && c.collapsed && c.off===0){
        const prev = c.el.previousElementSibling;
        if (prev){ e.preventDefault(); pushHist(true); merge(prev, c.el); afterChange(); updateCurrent(); return; }
        if (c.el.dataset.t!=="a" && !getText(c.el)){ e.preventDefault(); pushHist(true); setType(c.el,"a"); afterChange(); updateCurrent(); return; }
      }
      pushHist(false); return;
    }
    case "deleteContentForward": {
      const c = caret();
      if (c && c.collapsed && c.off===c.len && c.el.nextElementSibling){ e.preventDefault(); pushHist(true); const l=c.off; const nx=c.el.nextElementSibling; setText(c.el, getText(c.el)+getText(nx)); nx.remove(); setCaret(c.el,l); afterChange(); return; }
      pushHist(false); return;
    }
    case "historyUndo": e.preventDefault(); doUndo(); return;
    case "historyRedo": e.preventDefault(); doRedo(); return;
    case "formatBold": case "formatItalic": case "formatUnderline": e.preventDefault(); return;
    default: pushHist(/^delete/.test(e.inputType) && !getSelection().isCollapsed);
  }
});
ed.addEventListener("input", () => { normalize(); autoDetect(); lastSnap = snap(); markDirty(); updateCurrent(); updateAC(); });
ed.addEventListener("paste", e => {
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData("text/plain"); if (!txt) return;
  pushHist(true);
  if (!/\n/.test(txt.trim())){ document.execCommand("insertText", false, txt.replace(/\s+$/,"")); afterChange(); return; }
  const sel = getSelection(); if (!sel.isCollapsed){ document.execCommand("delete"); normalize(); }
  const c = caret(); if (!c) return;
  const parsed = parseFountain(txt).blocks; if (!parsed.length) return;
  const txtEl = getText(c.el), before = txtEl.slice(0,c.off), after = txtEl.slice(c.off);
  let anchor = c.el;
  if (before.trim()){ setText(c.el, before); } else { anchor = c.el.previousElementSibling; c.el.remove(); }
  let last = null;
  parsed.forEach(([t,x]) => { const n = makeEl(t, x, t==="s"?uid():""); if (anchor) anchor.after(n); else ed.prepend(n); anchor = n; last = n; });
  if (after.trim()){ const n = makeEl("a", after); last.after(n); }
  setCaret(last, getText(last).length);
  afterChange();
});
ed.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (!acEl.hidden){
    const items = acEl.querySelectorAll("button");
    if (e.key==="ArrowDown"){ e.preventDefault(); acSel = (acSel+1) % items.length; paintAC(); return; }
    if (e.key==="ArrowUp"){ e.preventDefault(); acSel = acSel<=0 ? items.length-1 : acSel-1; paintAC(); return; }
    if ((e.key==="Enter" || e.key==="Tab") && acSel>=0){ e.preventDefault(); acceptAC(acSel); return; }
    if (e.key==="Escape"){ e.preventDefault(); hideAC(true); return; }
  }
  if (e.key==="Tab"){ e.preventDefault(); const c = caret(); if (!c) return; applyType((e.shiftKey?STAB:TAB)[c.el.dataset.t] || "a"); return; }
  if (mod && /^[1-7]$/.test(e.key)){ e.preventDefault(); applyType(ORDER[+e.key-1]); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase()==="z"){ e.preventDefault(); doUndo(); return; }
  if (mod && ((e.shiftKey && e.key.toLowerCase()==="z") || e.key.toLowerCase()==="y")){ e.preventDefault(); doRedo(); return; }
  if (mod && /^[biu]$/i.test(e.key)){ e.preventDefault(); return; }
});

function buildTypebar(){

  };
  tb.addEventListener("touchstart", e => { const b = e.target.closest("button"); if (!b) return; touched = true; setTimeout(()=>touched=false, 700); if (b.dataset.act!=="side"){ e.preventDefault(); act(b); } }, {passive:false});
  tb.addEventListener("mousedown", e => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); if (touched){ touched=false; return; } act(b); });
  tb.addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.act==="side" && touched){ touched=false; act(b); } });

/* ============ autocomplete ============ */
const acEl = $("#ac"); let acSel = -1, acItems = [], acFor = null, acDismissed = null;
function suggestions(el){
  const t = el.dataset.t, raw = getText(el), u = raw.toUpperCase();
  if (t==="s"){
    const m = u.match(PREFIX_RE);
    const PREFIXES = SLang().prefixes, TIMES = SLang().times;
    if (!m) return PREFIXES.filter(p => p.startsWith(u) && p.trim()!==u.trim()).map(p => ({label:p.trim(), value:p}));
    const prefix = m[0].trim() + " ";
    const rest = u.slice(m[0].length);
    const dash = rest.lastIndexOf(" - ");
    if (dash>=0){ const tp = rest.slice(dash+3); return TIMES.filter(x => x.startsWith(tp) && x!==tp).slice(0,7).map(x => ({label:x, value: prefix + rest.slice(0,dash+3) + x})); }
    return locs.filter(l => l.startsWith(rest) && l!==rest).slice(0,7).map(l => ({label:l, value: prefix + l + " - "}));

function lineCharOffset(el, li){

const CHUNK = 60000;
const LocalStore = {
  get label(){ return T("Salvato su questo dispositivo"); },
  async list(){ try{ return JSON.parse(lsGet("abt:index")||"[]"); }catch(e){ return []; } },
  async load(id){ const raw = lsGet("abt:s:"+id); if (!raw) return null; return JSON.parse(raw); },

function makeDBStore(db, userId){
  const col = db.collection("data/users/"+userId);
  return {
    get label(){ return T("Salvato nel cloud"); },
    async list(){
      const q = await col.where("kind","==","meta").get();
      return q.docs.map(d => d.data()).map(d => ({id:d.sid, title:d.title, updated:d.updated})).sort((a,b)=>b.updated-a.updated);
    },
    async load(id){
      const m = await col.doc("m_"+id).get(); if (!m.exists) return null;
      const meta = m.data(); let body = "";
      for (let k=0; k<(meta.parts||1); k++){ const p = await col.doc(`s_${id}_${k}`).get(); if (p.exists) body += p.data().body || ""; }
      const b = await col.doc("b_"+id).get();
      return {id, title: meta.title, titlePage: JSON.parse(meta.titlePage||"{}"), settings: JSON.parse(meta.settings||"{}"),
        created: meta.created, updated: meta.updated, body: JSON.parse(body||"[]"), breakdown: b.exists ? JSON.parse(b.data().data||"{}") : {}};
    },
    async save(doc){
      const body = JSON.stringify(doc.body); const parts = Math.max(1, Math.ceil(body.length / CHUNK));
      for (let k=0; k<parts; k++) await col.doc(`s_${doc.id}_${k}`).set({kind:"part", sid:doc.id, body: body.slice(k*CHUNK, (k+1)*CHUNK)});
      for (let k=parts; k<(doc.prevParts||0); k++){ try{ await col.doc(`s_${doc.id}_${k}`).delete(); }catch(e){} }
      await col.doc("b_"+doc.id).set({kind:"bd", sid:doc.id, data: JSON.stringify(doc.breakdown||{})});
      await col.doc("m_"+doc.id).set({kind:"meta", sid:doc.id, title:doc.title, updated:doc.updated, created:doc.created||doc.updated, by: DEVICE,
        parts, titlePage: JSON.stringify(doc.titlePage||{}), settings: JSON.stringify(doc.settings||{})});
      return parts;
    },
    watch(id, cb){ return col.doc("m_"+id).onSnapshot(sn => { if (sn.exists && !sn.metadata.hasPendingWrites) cb(sn.data()); }, () => {}); },
    async remove(id){
      const m = await col.doc("m_"+id).get(); const parts = m.exists ? (m.data().parts||1) : 1;
      await col.doc("m_"+id).delete().catch(()=>{});
      for (let k=0;k<parts;k++) await col.doc(`s_${id}_${k}`).delete().catch(()=>{});
      await col.doc("b_"+id).delete().catch(()=>{});
    }
  };
}

async function saveNow(){

  if (saving){ saveAgain = true; return saving; }
  const doc = {id: cur.id, title: cur.title || T("Senza titolo"), titlePage: cur.titlePage, settings: S, breakdown: cur.breakdown,
    created: cur.created, updated: Date.now(), body: readModel(), prevParts: cur.parts||0};

  saving = (async () => {

        dirty = jstr(readModel())!==jstr(shBase); lastSaved = new Date();

      dirty = false; lastSaved = new Date();
      setSaveStatus(`${Store.label} · ${lastSaved.toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"})}`, Store===LocalStore?"local":"");
      lsSet("abt:last", cur.id);
      }
    }catch(err){
      setSaveStatus(T("Salvataggio non riuscito: riprovo tra poco"), "err");

/* three-way merge on blocks: base = last synced, local = this screen, remote = store */
function merge3(base, local, remote){
  const B = new Map(base.map(r => [r[2], r])), L = new Map(local.map(r => [r[2], r])), Rm = new Map(remote.map(r => [r[2], r]));
  const out = [];
  for (const r of remote){
    const id = r[2], b = B.get(id), l = L.get(id);
    if (l){ out.push(b && !sameRow(l, b) ? l : r); continue; }
    if (b && sameRow(r, b)) continue;
    out.push(r);
  }
  const have = new Set(out.map(r => r[2]));
  local.forEach((l, i) => {
    if (have.has(l[2])) return;
    const b = B.get(l[2]);
    if (b && !Rm.has(l[2]) && sameRow(l, b)) return;
    let pos = 0;
    for (let j=i-1; j>=0; j--){ const k = out.findIndex(x => x[2]===local[j][2]); if (k>=0){ pos = k+1; break; } }
    out.splice(pos, 0, l); have.add(l[2]);
  });
  return out;
}
function applyModel(m){

function diffStats(a, b){

    changed = true;

/* order keys: keep existing ones that are increasing, give new blocks a key between their neighbours */
function assignKeys(list){
  const keys = list.map(r => { const v = remoteMap.get(r[2]); return v ? v.k : null; });
  let prev = -Infinity, changed = new Set(), ok = true;
  for (let i=0; i<list.length; i++){
    if (keys[i]!==null && keys[i] > prev){ prev = keys[i]; continue; }
    let next = null; for (let j=i+1; j<list.length; j++){ if (keys[j]!==null && keys[j] > prev){ next = keys[j]; break; } }
    const lo = prev===-Infinity ? (next!==null ? next - 1024 : 0) : prev;
    const k = next===null ? lo + 1024 : (lo + next) / 2;
    if (next!==null && (next - lo) < 1e-6) ok = false;
    keys[i] = k; prev = k; changed.add(list[i][2]);
  }
  if (!ok){ list.forEach((r,i) => { keys[i] = (i+1)*1024; changed.add(r[2]); }); }
  return {keys, changed};
}

/* ============ PDF ============ */
function pdfText(s){ return String(s).replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/…/g,"...").replace(/—/g,"--").replace(/–/g,"-").replace(/[^\x00-\xff]/g,"?"); }
function buildPDF(){
  if (!window.jspdf){ toast(T("Il motore PDF non è ancora caricato. Riprova tra un attimo.")); return null; }
  const { jsPDF } = window.jspdf;
  const fmt = S.paper==="Letter" ? "letter" : "a4";
  const pdf = new jsPDF({unit:"pt", format: fmt});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  const left = 108, top = 72, CW = 7.2, LH = 12;
  const P = paginate(readModel(), S);
  pdf.setFont("courier","normal"); pdf.setFontSize(12);
  const tp = cur.titlePage || {};
  let first = true;
  if (tp.title){
    const center = (t, y) => { pdf.text(pdfText(t), W/2, y, {align:"center"}); };
    let y = H*0.36;
    pdf.setFont("courier","bold"); center(tp.title.toUpperCase(), y);
    const tw = pdf.getTextWidth(pdfText(tp.title.toUpperCase())); pdf.setLineWidth(.6); pdf.line(W/2-tw/2, y+2, W/2+tw/2, y+2);
    pdf.setFont("courier","normal"); y += 48;
    if (tp.credit){ center(tp.credit, y); y += 24; }
    if (tp.author){ tp.author.split("\n").forEach(l => { center(l, y); y += 14; }); y += 22; }
    if (tp.source){ tp.source.split("\n").forEach(l => { center(l, y); y += 14; }); }
    if (tp.contact){ const ls = tp.contact.split("\n"); let cy = H - 72 - (ls.length-1)*14; ls.forEach(l => { pdf.text(pdfText(l), left, cy); cy += 14; }); }
    if (tp.draft){ const ls = tp.draft.split("\n"); let cy = H - 72 - (ls.length-1)*14; ls.forEach(l => { pdf.text(pdfText(l), W-72, cy, {align:"right"}); cy += 14; }); }
    first = false;
  }
  P.pages.forEach((page, p) => {
    if (!first) pdf.addPage(fmt); first = false;
    if (p>0){ pdf.setFont("courier","normal"); pdf.text(`${p+1}.`, left + 60*CW, 45, {align:"right"}); }
    page.forEach(l => {
      const y = top + l.row*LH + 9;
      const bold = l.k==="s" && S.boldScenes;
      pdf.setFont("courier", bold ? "bold" : "normal");
      pdf.text(pdfText(l.text), left + l.x*CW, y);
      if (l.sn && S.sceneNums){ pdf.setFont("courier", bold?"bold":"normal"); pdf.text(String(l.sn), left - 6*CW, y); pdf.text(String(l.sn), left + 62*CW, y); }
    });
  });
  pdf.setProperties({title: cur.title||"Sceneggiatura", creator:"Abisso Typewriter"});
  return pdf;
}
function safeName(s){ return (s||T("Sceneggiatura")).replace(/[\\/:*?"<>|]+/g,"").trim().slice(0,80) || T("Sceneggiatura"); }
async function offerFile(filename, data){
  if (!downloadsAPI){
    try{ const blob = data instanceof Blob ? data : new Blob([data], {type: /\.pdf$/i.test(filename) ? "application/pdf" : "text/plain;charset=utf-8"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast(T("File pronto: {f}",{f:filename})); }catch(e){ toast(T("Non sono riuscito a salvare il file.")); }
    return;
  }
  try{ await downloadsAPI.save({filename, data}); toast(T("File pronto: {f}",{f:filename})); }
  catch(e){
    if (e && e.code==="declined") return;
    if (e && e.code==="rate_limited"){ toast(T("C'è già una richiesta di salvataggio aperta.")); return; }
    toast(T("Non sono riuscito a salvare il file.") + (e && e.message ? " "+e.message : ""));
  }
}

async function runAI(all){
  if (!sampleAPI || aiRun) return;
  const sc = lastA.scenes.filter(s=>s.n>0).filter(s => all || !cur.breakdown[s.id] || cur.breakdown[s.id].sig!==s.sig);
  if (!sc.length) return;
  const batches = []; let curB = [], size = 0;
  sc.forEach(s => { const t = `### SCENE ${s.n}\n${s.heading}\n${s.body.trim()}`.slice(0, 6000); if (curB.length && (size + t.length > 9000 || curB.length>=8)){ batches.push(curB); curB=[]; size=0; } curB.push({s, t}); size += t.length; });
  if (curB.length) batches.push(curB);
  aiRun = {done:0, total: sc.length, ctrl: new AbortController()};
  renderBD();
  const keys = CATS.map(c=>c[0]);
  let failed = null;
  for (const batch of batches){
    if (aiRun.ctrl.signal.aborted) break;
    const prompt = `You are an assistant director doing a script breakdown for the shooting schedule.
For EVERY scene below, list the production elements it needs. Reply with only a JSON array, one object per scene, in this shape:
[{"n":12,"oggetti":[],"costumi":[],"trucco":[],"veicoli":[],"comparse":[],"animali":[],"effetti":[],"suono":[],"note":""}]
Keys (keep them exactly as written):
- oggetti: props handled or mentioned as important, weapons included.
- costumi: specific wardrobe, uniforms, costume changes, wet or dirty costumes, with the character's name if useful (e.g. "soaked raincoat (Elena)").
- trucco: makeup, hair, wounds, blood, ageing.
- veicoli: cars, boats, vehicles on screen.
- comparse: background extras and groups, with a number when it can be inferred (e.g. "20 bar customers"). Do not list characters who have lines.
- animali: animals on screen.
- effetti: practical special effects and VFX (rain, smoke, fire, gunshots, lights turning on).
- suono: music in the scene, sounds or noises the text explicitly calls for.
- note: at most one sentence on relevant production needs (stunts, minors, water, heights), otherwise "".
Write every item and the note in ${SLang().ai}, short, lowercase except proper names. Do not invent anything the text does not say or clearly imply. Include every scene, even with empty lists. "n" is the scene number.

${batch.map(x=>x.t).join("\n\n")}`;
    try{
      const res = await sampleAPI.json(prompt, {modelTier:"default", signal: aiRun.ctrl.signal});
      const arr = Array.isArray(res) ? res : (res && Array.isArray(res.scene) ? res.scene : []);
      batch.forEach(({s}) => {
        const r = arr.find(x => x && +x.n===s.n); if (!r) return;
        const bd = bdFor(s.id);
        keys.forEach(k => {
          const ai = (Array.isArray(r[k]) ? r[k] : []).map(x=>String(x).trim()).filter(Boolean).slice(0,40);
          const prev = bd[k] || []; const prevAI = bd.ai && bd.ai[k] || [];
          const userAdded = prev.filter(x => !prevAI.includes(x));
          const merged = [...ai]; userAdded.forEach(x => { if (!merged.some(y=>y.toLowerCase()===x.toLowerCase())) merged.push(x); });
          bd[k] = merged; bd.ai = bd.ai || {}; bd.ai[k] = ai;
        });
        bd.note = typeof r.note==="string" ? r.note.trim() : "";
        bd.sig = s.sig;
      });
      aiRun.done += batch.length; markBD(); renderBD();
    }catch(e){
      if (e && (e.name==="AbortError" || e.code==="aborted")) break;
      failed = e; break;
    }
  }
  aiRun = null; renderBD();
  if (failed){
    const code = failed.code;
    toast(code==="not_granted" ? T("Per usare l'analisi AI serve il tuo permesso: riprova e accetta la richiesta.") :
          code==="rate_limited" ? T("Troppe richieste ravvicinate. Riprova tra qualche minuto: le scene già fatte restano salvate.") :
          code==="invalid_json" ? T("La risposta dell'AI non era leggibile. Riprova: riparto dalle scene mancanti.") :
          T("Analisi interrotta. Riprova più tardi.") + (failed.message ? " "+failed.message : ""), 4200);
  }
}

async function exportSheets(){
  if (!window.jspdf){ toast(T("Il motore PDF non è ancora caricato.")); return; }
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:"pt", format: S.paper==="Letter"?"letter":"a4"});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(); const M = 48;
  const sc = lastA.scenes.filter(s=>s.n>0);
  sc.forEach((s, k) => {
    if (k) pdf.addPage();
    const b = cur.breakdown[s.id]||{};
    pdf.setFont("helvetica","bold"); pdf.setFontSize(9); pdf.setTextColor(90); pdf.text(pdfText(T("FOGLIO DI SPOGLIO")), M, M);
    pdf.text(pdfText((cur.title||"").toUpperCase()), W-M, M, {align:"right"});
    pdf.setTextColor(0); pdf.setFontSize(26); pdf.text(String(s.n), M, M+40);
    pdf.setFontSize(13); pdf.text(pdfText(s.loc), M+60, M+28, {maxWidth: W-2*M-60});
    pdf.setFont("helvetica","normal"); pdf.setFontSize(10);
    pdf.text(pdfText(`${ieLabel(s.ie)||"—"}  ·  ${s.time||"—"}  ·  ${T("pagina {p}  ·  {e} di pagina",{p:s.page,e:eighths(s.e8)})}`), M+60, M+44);
    pdf.setDrawColor(180); pdf.line(M, M+58, W-M, M+58);
    const boxes = [[T("Personaggi"), s.cast.map(n=> n + (s.speakers[n]?"":" "+T("(non parla)")))], ...CATS.map(([kk,l]) => [l, b[kk]||[]])];
    const colW = (W-2*M-16)/2; let col = 0, y0 = M+78, ys = [y0, y0];
    boxes.forEach(([l, items]) => {
      const x = M + col*(colW+16); let y = ys[col];
      pdf.setFont("helvetica","bold"); pdf.setFontSize(8.5); pdf.setTextColor(90); pdf.text(l.toUpperCase(), x, y);
      pdf.setFont("helvetica","normal"); pdf.setFontSize(10.5); pdf.setTextColor(0); y += 15;
      const lines = items.length ? items.flatMap(it => pdf.splitTextToSize("•  "+pdfText(it), colW)) : ["—"];
      lines.forEach(l2 => { pdf.text(l2, x, y); y += 13.5; });
      ys[col] = y + 16; col = ys[0] <= ys[1] ? 0 : 1;
    });
    if (b.note){ const y = Math.max(...ys); pdf.setFont("helvetica","bold"); pdf.setFontSize(8.5); pdf.setTextColor(90); pdf.text(pdfText(T("NOTE")), M, y); pdf.setFont("helvetica","normal"); pdf.setFontSize(10.5); pdf.setTextColor(0); pdf.text(pdf.splitTextToSize(pdfText(b.note), W-2*M), M, y+15); }
    pdf.setFontSize(8); pdf.setTextColor(140); pdf.text("Abisso Typewriter", M, H-28); pdf.text(`${k+1} / ${sc.length}`, W-M, H-28, {align:"right"}); pdf.setTextColor(0);
  });
  if (!sc.length){ toast(T("Nessuna scena da esportare.")); return; }
  await offerFile(safeName(cur.title)+" - "+T("fogli di spoglio")+".pdf", pdf.output("blob"));
}

    applySettings(); closeOverlay(); cur.isSample = false; markBD();
    if (newUI !== UI) setUI(newUI); else { runTick(); updateCurrent(); }
  };
}
function showKeys(){
  const rows = [
    [T("Invio"),T("Nuovo elemento, con il tipo che viene dopo (Personaggio → Dialogo → Azione)")],
    [T("Invio su riga vuota"),T("Cambia tipo: Azione → Scena, altri → Azione")],
    [T("Tab / Maiusc+Tab"),T("Cambia tipo dell'elemento corrente (Azione → Personaggio, Dialogo → Parentetica…)")],
    [`${MOD}1 … ${MOD}7`,T("Scena, Azione, Personaggio, Parentetica, Dialogo, Transizione, Inquadratura")],
    [T("↑ ↓ e Invio"),T("Scegli un suggerimento (luoghi, momenti, personaggi, transizioni)")],
    [T("Maiusc+Invio"),T("A capo dentro lo stesso elemento")],
    [`${MOD}Z / ${MOD}${UI==="it"?"Maiusc":UI==="de"?"Umschalt":"Shift"}+Z`,T("Annulla / ripeti")],
    [`${MOD}S`,T("Salva subito")],
    [`${MOD}${UI==="it"?"Maiusc":UI==="de"?"Umschalt":"Shift"}+E`,T("Esporta PDF")],
    [T("Scorciatoie di scrittura"),T("\"int.\" o \"est.\" a inizio azione diventa una scena; \"(\" in un dialogo diventa parentetica")]
  ];
  overlay(`<div class="modal" role="dialog" aria-label="${T("Scorciatoie")}"><h3>${T("Scorciatoie")}</h3><div class="keys">${rows.map(([k,v])=>`<kbd style="justify-self:start">${esc(k)}</kbd><span>${esc(v)}</span>`).join("")}</div><div class="row"><button class="btn" data-close>${T("Chiudi")}</button></div></div>`);
  $("#overlay .modal [data-close]").onclick = closeOverlay;
}
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const txt = await f.text();
  let res;
  try{ res = /\.(fdx|xml)$/i.test(f.name) || /<FinalDraft/i.test(txt.slice(0,500)) ? parseFDX(txt) : parseFountain(txt); }
  catch(err){ toast(T("Non riesco a leggere questo file. Usa un file .fountain, .fdx o testo semplice.")); return; }
  if (!res.blocks.length){ toast(T("Il file non contiene testo di sceneggiatura riconoscibile.")); return; }
  const title = res.tp.title || f.name.replace(/\.(fountain|fdx|txt|xml|spmd)$/i,"");
  const guess = /^(INNEN|AUSSEN|AUßEN)/im.test(res.blocks.filter(b=>b[0]==="s").map(b=>b[1]).join("\n")) ? "de" : /^EST\./im.test(res.blocks.filter(b=>b[0]==="s").map(b=>b[1]).join("\n")) ? "it" : /^EXT\./im.test(res.blocks.filter(b=>b[0]==="s").map(b=>b[1]).join("\n")) ? "en" : UI;
  await newScript(res.blocks, {...res.tp, _lang: guess}, title);
  if (view!=="write") setView("write");
  toast(T("Importato: {n} elementi.",{n:res.blocks.length}));
});

/* mobile keyboard: keep the type bar and suggestions above it, and the caret above both */
function placeDock(){
  const tb = $("#typebar");
  if (!isPhone()){ tb.style.transform = ""; acEl.style.transform = ""; document.body.classList.remove("kb"); return; }
  const vv = window.visualViewport;
  const off = vv ? Math.max(0, innerHeight - vv.height - vv.offsetTop) : 0;
  const tr = off > 40 ? `translateY(${-off}px)` : "";
  tb.style.transform = tr; acEl.style.transform = tr;
  document.documentElement.style.setProperty("--tbh", tb.offsetHeight + "px");
  document.body.classList.toggle("kb", off > 40);
}
function keepCaretVisible(){
  if (!isPhone()) return;
  const sel = getSelection(); if (!sel.rangeCount || !ed.contains(sel.anchorNode)) return;
  let r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r.height){ const el = blockOf(sel.anchorNode); if (el) r = el.getBoundingClientRect(); else return; }
  const vv = window.visualViewport; const vh = vv ? vv.height + vv.offsetTop : innerHeight;
  const dock = $("#typebar").offsetHeight + (acEl.hidden ? 0 : acEl.offsetHeight) + 20;
  const sc = $("#scroller"); const topLimit = sc.getBoundingClientRect().top + 12;
  if (r.bottom > vh - dock) sc.scrollTop += r.bottom - (vh - dock);
  else if (r.top < topLimit) sc.scrollTop -= topLimit - r.top;
}
const keepCaretSoon = debounce(keepCaretVisible, 60);
if (window.visualViewport){ visualViewport.addEventListener("resize", () => { placeDock(); keepCaretSoon(); }); visualViewport.addEventListener("scroll", placeDock); }
window.addEventListener("resize", placeDock);
ed.addEventListener("input", keepCaretSoon);
ed.addEventListener("focus", () => setTimeout(() => { placeDock(); keepCaretVisible(); }, 350));
ed.addEventListener("blur", () => setTimeout(placeDock, 300));

/* text size and page colour: per device */
function applyDevicePrefs(){
  let z = 1;
  try{ z = parseFloat(lsGet("abt:zoom")) || 1; }catch(e){}
  document.documentElement.style.setProperty("--zoom", z);
  if (typeof pagesOn!=="undefined" && pagesOn) setTimeout(layoutPages, 50);
  setTimeout(renderMarks, 30);
}

window.addEventListener("beforeunload", () => { if (dirty && cur && !cur.isSample){ try{ lsSet("abt:backup:"+cur.id, JSON.stringify({id:cur.id,title:cur.title,titlePage:cur.titlePage,settings:S,breakdown:cur.breakdown,updated:Date.now(),body:readModel()})); }catch(e){} saveNow(); } });

/* ============ theme ============ */
let MODE = (() => { const m = lsGet("abt:mode"); return ["light","dark","auto"].includes(m) ? m : "light"; })();
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyMode(){
  const host = document.documentElement.getAttribute("data-theme");
  const dark = MODE==="dark" || (MODE==="auto" && (host ? host==="dark" : darkMQ.matches));
  document.documentElement.classList.toggle("mode-dark", dark);
}
function setMode(m, quiet){
  if (!["light","dark","auto"].includes(m)) return;
  MODE = m; lsSet("abt:mode", m); applyMode();
  if (view==="profile") renderProfile();
  if (!quiet) toast(m==="dark" ? "☾ "+T("Scuro") : m==="light" ? "☀ "+T("Chiaro") : T("Automatico (come il dispositivo)"));
}
try{ darkMQ.addEventListener("change", applyMode); }catch(e){}
try{ new MutationObserver(applyMode).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]}); }catch(e){}
applyMode();

/* ============ profile ============ */
let ME = null, pfQuery = "", pfList = null, pfShared = null;
async function renderProfile(){
  const box = $("#pfIn");
  const name = (ME && ME.name) || T("Tu");
  const avatar = ME && ME.avatarUrl;
  const fmt = t => t ? new Date(t).toLocaleString(LOCALE(),{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
  const draw = () => {
    const list = (pfList||[]).filter(x => !pfQuery || (x.title||"").toLowerCase().includes(pfQuery.toLowerCase()));
    const n = (pfList||[]).length;
    box.innerHTML = `
      <div class="who">${avatar ? `<img src="${esc(avatar)}" alt="">` : ""}
        <div><h2>${esc(name)}</h2><p>${esc(false ? T(n===1?"Profilo su questo browser · 1 copione":"Profilo su questo browser · {n} copioni",{n}) : T(n===1?"Il tuo spazio privato · 1 copione":"Il tuo spazio privato · {n} copioni",{n}))}</p></div></div>
      <div class="pf-sec"><h3>${T("I miei copioni")}</h3>
        <div class="pf-bar"><input id="pfSearch" type="search" placeholder="${T("Cerca per titolo")}" aria-label="${T("Cerca per titolo")}" value="${esc(pfQuery)}">
          <button class="btn primary" data-pa="new">${T("Nuovo copione")}</button><button class="btn" data-pa="import">${T("Importa file")}</button></div>
        ${pfList===null ? `<p class="empty-note">${T("Caricamento dei copioni…")}</p>` :
          !list.length ? `<p class="empty-note">${n ? T("Nessun copione con questo titolo.") : T("Non hai ancora copioni salvati. Creane uno nuovo o importa un file .fountain o .fdx.")}</p>` :
          `<div class="cards">${list.map(x => `<div class="card ${cur && x.id===cur.id?"cur":""}">
            <button class="card-open" data-po="${x.id}">${cur && x.id===cur.id ? `<span class="badge">${T("Aperto")}</span>` : ""}<b>${esc(x.title||T("Senza titolo"))}</b><small>${T("Modificato {d}",{d:fmt(x.updated)})}</small></button>
            <div class="card-acts">${DB ? `<button data-pshare="${x.id}">${T("Condividi")}</button>` : ""}<button data-pd="${x.id}">${T("Duplica")}</button><button class="warn" data-px="${x.id}">${T("Elimina")}</button></div></div>`).join("")}</div>`}
      </div>
      ${DB ? `<div class="pf-sec"><h3>${T("Copioni condivisi")}</h3>
        ${pfShared===null ? `<p class="empty-note">${T("Caricamento dei copioni…")}</p>` :
          !pfShared.length ? `<p class="empty-note">${T("Nessun copione condiviso. Apri un tuo copione e usa Condividi: chi riceve il link può scriverci insieme a te.")}</p>` :
          `<div class="cards">${pfShared.filter(x => !pfQuery || (x.title||"").toLowerCase().includes(pfQuery.toLowerCase())).map(x => `<div class="card shared ${cur && cur.shared===x.id?"cur":""}">
            <button class="card-open" data-pso="${x.id}"><span class="badge">${cur && cur.shared===x.id ? T("Aperto") : T("Condiviso")}</span><b>${esc(x.title||T("Senza titolo"))}</b><small>${esc(T("Ultima modifica: {n}, {d}",{n:x.byName||"?", d:fmt(x.updated)}))}</small></button>
            <div class="card-acts"><button data-pslink="${x.id}">${T("Link")}</button><button class="warn" data-psx="${x.id}">${T(x.own ? "Elimina" : "Togli dalla lista")}</button></div></div>`).join("")}</div>`}
      </div>` : ""}
      <div class="pf-sec"><h3>${T("Preferenze")}</h3>
        <div class="prefs">
          <div class="pref"><label for="pfName">${T("Il tuo nome nei copioni condivisi")}</label><input id="pfName" maxlength="40" value="${esc(myName())}" placeholder="${esc((ME && ME.name) || T("Nome"))}"></div>
          <div class="pref"><label>${T("Lingua dell'interfaccia")}</label><div class="pill">${["it","en","de"].map(l=>`<button data-pl="${l}" class="${UI===l?"on":""}">${l.toUpperCase()}</button>`).join("")}</div></div>
          <div class="pref"><label>${T("Tema")}</label><div class="pill">${[["light",T("Chiaro")],["dark",T("Scuro")],["auto",T("Auto")]].map(([m,l])=>`<button data-pm="${m}" class="${MODE===m?"on":""}">${l}</button>`).join("")}</div></div>
          <div class="pref"><label for="pfZoom">${T("Dimensione del testo su questo dispositivo")}</label><select id="pfZoom">${[["0.85","Piccola"],["1","Normale"],["1.15","Grande"],["1.3","Molto grande"]].map(([v,l])=>`<option value="${v}">${T(l)}</option>`).join("")}</select></div>
        </div>
      </div>
      <div class="pf-sec" hidden><h3>${T("Altre persone")}</h3>
        <p class="note">${T("I tuoi copioni li vedi solo tu. Quando ne condividi uno, diventa un copione condiviso: chi ha il link e il tuo invito come Editor ci scrive insieme a te, e ogni modifica resta nella cronologia con il nome di chi l'ha fatta.")}</p>
      </div>`;
    const nm = $("#pfName"); nm.onchange = () => { const v = nm.value.trim(); if (v){ lsSet("abt:name", v.slice(0,40)); lastPresence = ""; sendPresence(); renderShareBar(); toast(T("Nome salvato.")); } };
    const z = $("#pfZoom"); z.value = String(parseFloat(lsGet("abt:zoom")) || 1);
    z.onchange = () => { lsSet("abt:zoom", z.value); applyDevicePrefs(); };
    const q = $("#pfSearch"); q.oninput = () => { pfQuery = q.value; const pos = q.selectionStart; draw(); const q2 = $("#pfSearch"); q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} };
  };
  draw();
  try{ pfList = Store ? await Store.list() : []; }catch(e){ pfList = []; }
  if (view==="profile") draw();
  if (DB){ try{ pfShared = await Shared.list(); }catch(e){ pfShared = []; } if (view==="profile") draw(); }
}
$("#pfIn").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pa==="new"){ await newScript(); setView("write"); return; }
  if (b.dataset.pa==="import"){ $("#fileIn").click(); return; }
  if (b.dataset.po){ if (!cur || b.dataset.po!==cur.id) await openScript(b.dataset.po); setView("write"); return; }
  if (b.dataset.pd){ const d = await Store.load(b.dataset.pd); if (!d) return; await newScript(d.body.map(x=>[x[0],x[1]]), {...d.titlePage, _lang:(d.settings||{}).lang}, (d.title||T("Senza titolo"))+T(" (copia)")); toast(T("Copia creata.")); setView("profile"); return; }
  if (b.dataset.px){
    if (b.dataset.confirm!=="1"){ b.dataset.confirm = "1"; b.textContent = T("Conferma"); return; }
    await Store.remove(b.dataset.px);
    if (cur && cur.id===b.dataset.px){ const rest = await Store.list(); if (rest.length) await openScript(rest[0].id); else loadDoc(sampleDoc()); }
    toast(T("Copione eliminato.")); renderProfile(); return;
  }
  if (b.dataset.pl){ setUI(b.dataset.pl); renderProfile(); return; }
  if (b.dataset.pshare){ if (!cur || cur.id!==b.dataset.pshare) await openScript(b.dataset.pshare); setView("write"); await makeShared(); return; }
  if (b.dataset.pso){ await openShared(b.dataset.pso); setView("write"); return; }
  if (b.dataset.pslink){ const keep = cur; if (!cur || cur.shared!==b.dataset.pslink){ await openShared(b.dataset.pslink); setView("write"); } showShare(); return; }
  if (b.dataset.psx){
    if (b.dataset.confirm!=="1"){ b.dataset.confirm = "1"; b.textContent = T("Conferma"); return; }
    await Shared.remove(b.dataset.psx);
    if (cur && cur.shared===b.dataset.psx){ const rest = await Store.list(); if (rest.length) await openScript(rest[0].id); else loadDoc(sampleDoc()); }
    toast(T("Copione eliminato.")); renderProfile(); return;
  }
  if (b.dataset.pm){ setMode(b.dataset.pm, true); return; }
});

/* ============ language switching ============ */
function applyStaticI18n(){
  document.documentElement.lang = UI;
  document.querySelectorAll("[data-i18n]").forEach(el => { if (el.id!=="stSave" || !Store) el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", T(el.dataset.i18nAria)));
}
function setUI(l){
  if (!["it","en","de"].includes(l) || l===UI) return;
  UI = l; lsSet("abt:ui", l);
  applyStaticI18n(); buildTypebar(); runTick(); updateCurrent(); renderShareBar(); if (view==="profile") renderProfile();
  if (cur && cur.isSample && !dirty){ loadDoc(sampleDoc()); }
  if (Store) setSaveStatus(dirty ? T("Modifiche non salvate") : (cur && cur.isSample ? (Store===LocalStore ? T("Esempio · si salva su questo dispositivo quando scrivi") : T("Esempio · si salva nel cloud quando scrivi")) : Store.label), dirty ? "busy" : (Store===LocalStore?"local":""));
  toast(LANG_NAMES[l]);
}

/* ============ boot ============ */
async function useCap(name){
  if (!window.claude || typeof window.claude.use!=="function") return null;
  try{ return await Promise.race([window.claude.use(name), new Promise(r=>setTimeout(()=>r(null), 10000))]); }catch(e){ return null; }
}
async function boot(){
  applyStaticI18n();
  applyPageClass();
  buildTypebar();
  applyDevicePrefs();
  loadDoc(sampleDoc());
  placeDock();
  setSaveStatus(T("Connessione…"),"busy");
  // optional capabilities in parallel
  useCap("downloads").then(d => downloadsAPI = d);
  useCap("sample").then(s => { sampleAPI = s; if (view==="bd") renderBD(); });
  const [db, user] = await Promise.all([useCap("db"), useCap("user")]);
  USER = user; DB = await rtReady(); if (DB) watchConnection();
  let userId = null; if (db && user){ try{ userId = await user.id(); }catch(e){} }
  if (user){ try{ ME = await user.me(); const av = $("#meAvatar"); if (ME && ME.avatarUrl){ av.src = ME.avatarUrl; av.hidden = false; } }catch(e){} }
  Store = (db && userId) ? makeDBStore(db, userId) : LocalStore;
  let list = [];
  try{ list = await Store.list(); }catch(e){ Store = LocalStore; list = await LocalStore.list(); }
  setSaveStatus(cur.isSample ? (Store===LocalStore ? T("Esempio · si salva su questo dispositivo quando scrivi") : T("Esempio · si salva nel cloud quando scrivi")) : Store.label, Store===LocalStore?"local":"");
  const hm = BOOT_HASH.match(/^#c-([a-z0-9]+)$/);
  if (hm && DB){ await openShared(hm[1]); return; }
  if (list.length && cur.isSample && !dirty){
    const last = lsGet("abt:last"); const pick = list.find(x=>x.id===last) || list[0];
    await openScript(pick.id);
  }
}
boot();
