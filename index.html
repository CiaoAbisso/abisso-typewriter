let PDF_UNI = false;
function useUniFont(pdf){ pdf.addFileToVFS("AbissoMono-Regular.ttf", MONO_R); pdf.addFont("AbissoMono-Regular.ttf", "AbissoMono", "normal"); pdf.addFileToVFS("AbissoMono-Bold.ttf", MONO_B); pdf.addFont("AbissoMono-Bold.ttf", "AbissoMono", "bold"); }
const needsUni = x => /[^\x00-\xff’‘“”«»…—–•]/.test(typeof x==="string" ? x : JSON.stringify(x));
function pdfText(s){ if (PDF_UNI) return String(s); return String(s).replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/…/g,"...").replace(/—/g,"--").replace(/–/g,"-").replace(/[^\x00-\xff]/g,"?"); }
function buildPDF(opts){
  opts = opts || {};
  if (!window.jspdf){ toast(T("Il motore PDF non è ancora caricato. Riprova tra un attimo.")); return null; }
  const { jsPDF } = window.jspdf;
  const fmt = S.paper==="Letter" ? "letter" : "a4";
  const pdf = new jsPDF({unit:"pt", format: fmt});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  const left = 108, top = 72, CW = 7.2, LH = 12;
  const model0 = readModel(); SCN = computeSCN(model0);
  const P = paginate(model0, S);
  const RS = opts.marks ? computeRev(model0) : null, prc = pendingRev();
  const revHead = RS ? `${revName(prc, S.labels)} Rev. ${new Date().toLocaleDateString(LOCALE(), {day:"2-digit", month:"2-digit", year:"2-digit"})}` : "";
  const keep = opts.onlyRev && RS ? new Set(revisedPages(P)) : null;
  PDF_UNI = needsUni([model0, cur.titlePage||{}, opts.wm||"", revHead]); const MF = PDF_UNI ? "AbissoMono" : "courier"; if (PDF_UNI) useUniFont(pdf);
  pdf.setFont(MF,"normal"); pdf.setFontSize(12);
  const tp = cur.titlePage || {};
  let first = true;
  const wmark = () => { if (!opts.wm) return; try{ pdf.saveGraphicsState(); pdf.setGState(new pdf.GState({opacity:0.09})); }catch(e){}
    pdf.setFont(MF, "bold"); const fs = Math.min(64, 900 / Math.max(6, opts.wm.length)); pdf.setFontSize(fs);
    const tw = pdf.getTextWidth(pdfText(opts.wm)), a = Math.PI/4;
    pdf.setTextColor(0); pdf.text(pdfText(opts.wm), W/2 - Math.cos(a)*tw/2, H/2 + Math.sin(a)*tw/2, {angle:45});
    try{ pdf.restoreGraphicsState(); }catch(e){} pdf.setFontSize(12); pdf.setFont(MF, "normal"); };
  if (keep){
    pdf.setFont(MF, "bold"); pdf.text(pdfText((tp.title || cur.title || "").toUpperCase()), left, top + 9);
    pdf.setFont(MF, "normal");
    const pl = [...keep].map(p => p);
    const scs = new Set(); P.pages.forEach((pg, p) => { if (!keep.has(p)) return; let cs = null; pg.forEach(l => { if (l.sn) cs = l.sn; if (lineRev(l, RS)) scs.add(String(cs || l.sn || "")); }); });
    const lines = [revHead, "", ...wrap(`${({it:"Pagine",en:"Pages",de:"Seiten",fr:"Pages",es:"Páginas",uk:"Сторінки"})[S.labels]||"Pages"}: ${pageRanges(pl)}`, 60),
      ...wrap(`${({it:"Scene",en:"Scenes",de:"Szenen",fr:"Scènes",es:"Escenas",uk:"Сцени"})[S.labels]||"Scenes"}: ${[...scs].filter(Boolean).join(", ")}`, 60)];
    lines.forEach((l, k) => pdf.text(pdfText(l), left, top + 9 + (k+2)*LH));
    wmark(); first = false;
  }
  if (tp.title && !keep){
    const center = (t, y) => { pdf.text(pdfText(t), W/2, y, {align:"center"}); };
    let y = H*0.36;
    pdf.setFont(MF,"bold"); center(tp.title.toUpperCase(), y);
    const tw = pdf.getTextWidth(pdfText(tp.title.toUpperCase())); pdf.setLineWidth(.6); pdf.line(W/2-tw/2, y+2, W/2+tw/2, y+2);
    pdf.setFont(MF,"normal"); y += 48;
    if (tp.credit){ center(tp.credit, y); y += 24; }
    if (tp.author){ tp.author.split("\n").forEach(l => { center(l, y); y += 14; }); y += 22; }
    if (tp.source){ tp.source.split("\n").forEach(l => { center(l, y); y += 14; }); }
    if (tp.contact){ const ls = tp.contact.split("\n"); let cy = H - 72 - (ls.length-1)*14; ls.forEach(l => { pdf.text(pdfText(l), left, cy); cy += 14; }); }
    if (tp.draft){ const ls = tp.draft.split("\n"); let cy = H - 72 - (ls.length-1)*14; ls.forEach(l => { pdf.text(pdfText(l), W-72, cy, {align:"right"}); cy += 14; }); }
    wmark(); first = false;
  }
  P.pages.forEach((page, p) => {
    if (keep && !keep.has(p)) return;
    if (!first) pdf.addPage(fmt); first = false;
    if (p>0){ pdf.setFont(MF,"normal"); pdf.text(`${p+1}.`, left + 60*CW, 45, {align:"right"}); }
    if (RS && page.some(l => lineRev(l, RS))){ pdf.setFont(MF,"normal"); pdf.text(pdfText(revHead), p>0 ? left + 60*CW - (String(p+1).length+3)*CW : left + 60*CW, 45, {align:"right"}); }
    page.forEach(l => {
      const y = top + l.row*LH + 9;
      if (RS && lineRev(l, RS)){ pdf.setFont(MF,"normal"); pdf.text("*", left + (l.sn && S.sceneNums ? 63 + String(l.sn).length : 61.5)*CW, y); }
      if (l.k==="dual"){ pdf.setFont(MF,"normal"); l.parts.forEach(q => pdf.text(pdfText(q.text), left + q.x*CW, y)); return; }
      const bold = l.k==="s" && S.boldScenes;
      pdf.setFont(MF, bold ? "bold" : "normal");
      pdf.text(pdfText(l.text), left + l.x*CW, y);
      if (l.sn && S.sceneNums){ pdf.setFont(MF, bold?"bold":"normal"); pdf.text(String(l.sn), left - 6*CW, y); pdf.text(String(l.sn), left + 62*CW, y); }
    });
  });
  if (opts.wm){ const n = pdf.getNumberOfPages(); for (let k = (keep || tp.title) ? 2 : 1; k<=n; k++){ pdf.setPage(k); wmark(); } }
  pdf.setProperties({title: cur.title||"Sceneggiatura", creator:"Abisso Typewriter"});
  return pdf;
}
function safeName(s){ return (s||T("Sceneggiatura")).replace(/[\\/:*?"<>|]+/g,"").trim().slice(0,80) || T("Sceneggiatura"); }
async function offerFile(filename, data){
  if (!downloadsAPI){
    try{ const blob = data instanceof Blob ? data : new Blob([data], {type: /\.pdf$/i.test(filename) ? "application/pdf" : "text/plain;charset=utf-8"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast(T("File pronto: {f}",{f:filename})); }catch(e){ toast(T("Non sono riuscito a salvare il file.")); }
    return;
  }
  try{ await downloadsAPI.save({filename, data}); toast(T("File pronto: {f}",{f:filename})); }
  catch(e){
    if (e && e.code==="declined") return;
    if (e && e.code==="rate_limited"){ toast(T("C'è già una richiesta di salvataggio aperta.")); return; }
    toast(T("Non sono riuscito a salvare il file.") + (e && e.message ? " "+e.message : ""));
  }
}
async function exportPDF(){
  if (dirty) saveNow();
  const pdf = buildPDF(); if (!pdf) return;
  await offerFile(safeName(cur.title)+".pdf", pdf.output("blob"));
}
async function exportFountain(){
  const txt = toFountain(readModel(), cur.titlePage||{});
  await offerFile(safeName(cur.title)+".fountain.txt", txt);
}

async function runAI(all){
  if (!sampleAPI || aiRun) return;
  const sc = lastA.scenes.filter(s=>s.n>0).filter(s => all || !cur.breakdown[s.id] || cur.breakdown[s.id].sig!==s.sig);
  if (!sc.length) return;
  const batches = []; let curB = [], size = 0;
  sc.forEach(s => { const t = `### SCENE ${s.n}\n${s.heading}\n${s.body.trim()}`.slice(0, 6000); if (curB.length && (size + t.length > 9000 || curB.length>=8)){ batches.push(curB); curB=[]; size=0; } curB.push({s, t}); size += t.length; });
  if (curB.length) batches.push(curB);
  aiRun = {done:0, total: sc.length, ctrl: new AbortController()};
  renderBD();
  const keys = CATS.map(c=>c[0]);
  let failed = null;
  for (const batch of batches){
    if (aiRun.ctrl.signal.aborted) break;
    const prompt = `You are an assistant director doing a script breakdown for the shooting schedule.
For EVERY scene below, list the production elements it needs. Reply with only a JSON array, one object per scene, in this shape:
[{"n":12,"oggetti":[],"costumi":[],"trucco":[],"veicoli":[],"comparse":[],"animali":[],"effetti":[],"suono":[],"note":""}]
Keys (keep them exactly as written):
- oggetti: props handled or mentioned as important, weapons included.
- costumi: specific wardrobe, uniforms, costume changes, wet or dirty costumes, with the character's name if useful (e.g. "soaked raincoat (Elena)").
- trucco: makeup, hair, wounds, blood, ageing.
- veicoli: cars, boats, vehicles on screen.
- comparse: background extras and groups, with a number when it can be inferred (e.g. "20 bar customers"). Do not list characters who have lines.
- animali: animals on screen.
- effetti: practical special effects and VFX (rain, smoke, fire, gunshots, lights turning on).
- suono: music in the scene, sounds or noises the text explicitly calls for.
- note: at most one sentence on relevant production needs (stunts, minors, water, heights), otherwise "".
Write every item and the note in ${SLang().ai}, short, lowercase except proper names. Do not invent anything the text does not say or clearly imply. Include every scene, even with empty lists. "n" is the scene number.

${batch.map(x=>x.t).join("\n\n")}`;
    try{
      const res = await sampleAPI.json(prompt, {modelTier:"default", signal: aiRun.ctrl.signal});
      const arr = Array.isArray(res) ? res : (res && Array.isArray(res.scene) ? res.scene : []);
      batch.forEach(({s}) => {
        const r = arr.find(x => x && +x.n===s.n); if (!r) return;
        const bd = bdFor(s.id);
        keys.forEach(k => {
          const ai = (Array.isArray(r[k]) ? r[k] : []).map(x=>String(x).trim()).filter(Boolean).slice(0,40);
          const prev = bd[k] || []; const prevAI = bd.ai && bd.ai[k] || [];
          const userAdded = prev.filter(x => !prevAI.includes(x));
          const merged = [...ai]; userAdded.forEach(x => { if (!merged.some(y=>y.toLowerCase()===x.toLowerCase())) merged.push(x); });
          bd[k] = merged; bd.ai = bd.ai || {}; bd.ai[k] = ai;
        });
        bd.note = typeof r.note==="string" ? r.note.trim() : "";
        bd.sig = s.sig;
      });
      aiRun.done += batch.length; markBD(); renderBD();
    }catch(e){
      if (e && (e.name==="AbortError" || e.code==="aborted")) break;
      failed = e; break;
    }
  }
  aiRun = null; renderBD();
  if (failed){
    const code = failed.code;
    toast(code==="not_granted" ? T("Per usare l'analisi AI serve il tuo permesso: riprova e accetta la richiesta.") :
          code==="rate_limited" ? T("Troppe richieste ravvicinate. Riprova tra qualche minuto: le scene già fatte restano salvate.") :
          code==="invalid_json" ? T("La risposta dell'AI non era leggibile. Riprova: riparto dalle scene mancanti.") :
          T("Analisi interrotta. Riprova più tardi.") + (failed.message ? " "+failed.message : ""), 4200);
  }
}

async function exportSheets(){
  if (!window.jspdf){ toast(T("Il motore PDF non è ancora caricato.")); return; }
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:"pt", format: S.paper==="Letter"?"letter":"a4"});
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(); const M = 48;
  const sc = lastA.scenes.filter(s=>s.n>0);
  PDF_UNI = needsUni([cur.title, sc.map(s => [s.loc, s.time, s.cast]), cur.breakdown, T("FOGLIO DI SPOGLIO"), CATS.map(c=>c[1])]); const HF = PDF_UNI ? "AbissoMono" : "helvetica"; if (PDF_UNI) useUniFont(pdf);
  sc.forEach((s, k) => {
    if (k) pdf.addPage();
    const b = cur.breakdown[s.id]||{};
    pdf.setFont(HF,"bold"); pdf.setFontSize(9); pdf.setTextColor(90); pdf.text(pdfText(T("FOGLIO DI SPOGLIO")), M, M);
    pdf.text(pdfText((cur.title||"").toUpperCase()), W-M, M, {align:"right"});
    pdf.setTextColor(0); pdf.setFontSize(26); pdf.text(String(s.n), M, M+40);
    pdf.setFontSize(13); pdf.text(pdfText(s.loc), M+60, M+28, {maxWidth: W-2*M-60});
    pdf.setFont(HF,"normal"); pdf.setFontSize(10);
    pdf.text(pdfText(`${ieLabel(s.ie)||"—"}  ·  ${s.time||"—"}  ·  ${T("pagina {p}  ·  {e} di pagina",{p:s.page,e:eighths(s.e8)})}`), M+60, M+44);
    pdf.setDrawColor(180); pdf.line(M, M+58, W-M, M+58);
    const boxes = [[T("Personaggi"), s.cast.map(n=> n + (s.speakers[n]?"":" "+T("(non parla)")))], ...CATS.map(([kk,l]) => [l, b[kk]||[]])];
    const colW = (W-2*M-16)/2; let col = 0, y0 = M+78, ys = [y0, y0];
    boxes.forEach(([l, items]) => {
      const x = M + col*(colW+16); let y = ys[col];
      pdf.setFont(HF,"bold"); pdf.setFontSize(8.5); pdf.setTextColor(90); pdf.text(l.toUpperCase(), x, y);
      pdf.setFont(HF,"normal"); pdf.setFontSize(10.5); pdf.setTextColor(0); y += 15;
      const lines = items.length ? items.flatMap(it => pdf.splitTextToSize("•  "+pdfText(it), colW)) : ["—"];
      lines.forEach(l2 => { pdf.text(l2, x, y); y += 13.5; });
      ys[col] = y + 16; col = ys[0] <= ys[1] ? 0 : 1;
    });
    if (b.note){ const y = Math.max(...ys); pdf.setFont(HF,"bold"); pdf.setFontSize(8.5); pdf.setTextColor(90); pdf.text(pdfText(T("NOTE")), M, y); pdf.setFont(HF,"normal"); pdf.setFontSize(10.5); pdf.setTextColor(0); pdf.text(pdf.splitTextToSize(pdfText(b.note), W-2*M), M, y+15); }
    pdf.setFontSize(8); pdf.setTextColor(140); pdf.text("Abisso Typewriter", M, H-28); pdf.text(`${k+1} / ${sc.length}`, W-M, H-28, {align:"right"}); pdf.setTextColor(0);
  });
  if (!sc.length){ toast(T("Nessuna scena da esportare.")); return; }
  await offerFile(safeName(cur.title)+" - "+T("fogli di spoglio")+".pdf", pdf.output("blob"));
}

/* mobile keyboard: keep the type bar and suggestions above it, and the caret above both */
function placeDock(){
  const tb = $("#typebar");
  if (!isPhone()){ tb.style.transform = ""; acEl.style.transform = ""; document.body.classList.remove("kb"); return; }
  const vv = window.visualViewport;
  const off = vv ? Math.max(0, innerHeight - vv.height - vv.offsetTop) : 0;
  const tr = off > 40 ? `translateY(${-off}px)` : "";
  tb.style.transform = tr; acEl.style.transform = tr;
  document.documentElement.style.setProperty("--tbh", tb.offsetHeight + "px");
  document.body.classList.toggle("kb", off > 40);
}
function keepCaretVisible(){
  if (!isPhone()) return;
  const sel = getSelection(); if (!sel.rangeCount || !ed.contains(sel.anchorNode)) return;
  let r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r.height){ const el = blockOf(sel.anchorNode); if (el) r = el.getBoundingClientRect(); else return; }
  const vv = window.visualViewport; const vh = vv ? vv.height + vv.offsetTop : innerHeight;
  const dock = $("#typebar").offsetHeight + (acEl.hidden ? 0 : acEl.offsetHeight) + 20;
  const sc = $("#scroller"); const topLimit = sc.getBoundingClientRect().top + 12;
  if (r.bottom > vh - dock) sc.scrollTop += r.bottom - (vh - dock);
  else if (r.top < topLimit) sc.scrollTop -= topLimit - r.top;
}
const keepCaretSoon = debounce(keepCaretVisible, 60);
if (window.visualViewport){ visualViewport.addEventListener("resize", () => { placeDock(); keepCaretSoon(); }); visualViewport.addEventListener("scroll", placeDock); }
window.addEventListener("resize", placeDock);
ed.addEventListener("input", keepCaretSoon);
ed.addEventListener("focus", () => setTimeout(() => { placeDock(); keepCaretVisible(); }, 350));
ed.addEventListener("blur", () => setTimeout(placeDock, 300));

      if (sOk && end <= n + len){ r.setEnd(node, end - n); return true; }
      n += len; return false;
    }
    if (node.classList && node.classList.contains("pgap")) return false;

    return false;
  };

}

/* --- diff (Myers) on block sequences: what's new in b, what's gone from a --- */
function diffIdx(a, b){
  const ins = new Set(), delA = new Set(), delAt = new Set();
  let s = 0; while (s<a.length && s<b.length && a[s]===b[s]) s++;
  let ea = a.length, eb = b.length; while (ea>s && eb>s && a[ea-1]===b[eb-1]){ ea--; eb--; }
  const A = a.slice(s, ea), B = b.slice(s, eb), N = A.length, M = B.length;
  const all = () => { for (let j=0;j<M;j++) ins.add(s+j); for (let i=0;i<N;i++){ delA.add(s+i); delAt.add(s); } return {ins, delA, delAt}; };
  if (!N || !M) return all();
  const max = Math.min(N+M, 1500), off = max+1, V = new Int32Array(2*max+3), trace = [];
  let D = -1;
  outer: for (let d=0; d<=max; d++){
    trace.push(V.slice(off-d-1, off+d+2));
    for (let k=-d; k<=d; k+=2){
      let x = (k===-d || (k!==d && V[off+k-1] < V[off+k+1])) ? V[off+k+1] : V[off+k-1]+1;
      let y = x - k;
      while (x<N && y<M && A[x]===B[y]){ x++; y++; }
      V[off+k] = x;
      if (x>=N && y>=M){ D = d; break outer; }
    }
  }
  if (D<0) return all();
  let x = N, y = M;
  for (let d=D; d>0; d--){
    const W = trace[d], g = k => W[k+d+1], k = x - y;
    const pk = (k===-d || (k!==d && g(k-1) < g(k+1))) ? k+1 : k-1;
    const px = g(pk), py = px - pk;
    if (pk===k+1) ins.add(s+py); else { delA.add(s+px); delAt.add(s+py); }
    x = px; y = py;
  }
  return {ins, delA, delAt};
}

/* --- locked scene numbers: 12, 12A, 12B …; removed scenes stay as OMITTED --- */
const letterOf = n => { let r = ""; while (n>0){ n--; r = String.fromCharCode(65 + n%26) + r; n = Math.floor(n/26); } return r; };
function computeSCN(model){
  const L = X().lock; if (!L || !L.order) return null;
  const lab = {}, omitBefore = {}, have = new Set(), lk = new Map(L.order);
  model.forEach(r => { if (r[0]==="s" && r[2]) have.add(r[2]); });
  let pend = [];
  L.order.forEach(([id, l]) => { if (have.has(id)){ if (pend.length){ omitBefore[id] = pend; pend = []; } } else pend.push(l); });
  const sc = model.filter(r => r[0]==="s");
  let last = null, n = 0;
  sc.forEach((r, k) => {
    const id = r[2]; if (!id) return;
    if (lk.has(id)){ last = lk.get(id); n = 0; lab[id] = last; return; }
    n++;
    if (last!==null) lab[id] = last + letterOf(n);
    else { const nx = sc.slice(k+1).find(q => q[2] && lk.has(q[2])); lab[id] = letterOf(n) + (nx ? lk.get(nx[2]) : "1"); }
  });
  return {lab, omitBefore, omitEnd: pend};
}
function computeRev(model){
  const x = X(), revs = x.revs || []; if (!x.lock || !revs.length) return null;
  const base = cur.xb && cur.xb[revs[revs.length-1].vid]; if (!base) return null;
  const d = diffIdx(base.map(blockKey), model.map(blockKey));
  const set = new Set([...d.ins].filter(i => String(model[i][1]).trim()));
  d.delAt.forEach(p => { let q = Math.min(p, model.length-1); while (q>0 && !String(model[q][1]).trim()) q--; if (q>=0) set.add(q); });
  return set;
}

async function showCompare(vid, name){

  const out = []; let i = 0, j = 0, same = 0, add = 0, del = 0;
  const row = (cls, r) => `<div class="cp ${cls} t-${r[0]}"><span class="cp-t">${esc(TYPES[r[0]]||"")}</span><span class="cp-x">${esc(r[1])}</span></div>`;
  const flush = () => { if (same){ out.push(`<div class="cp-same">${T(same===1?"{n} elemento invariato":"{n} elementi invariati",{n:same})}</div>`); same = 0; } };
  while (i<old.length || j<now.length){
    if (i<old.length && d.delA.has(i)){ flush(); if (String(old[i][1]).trim()){ out.push(row("del", old[i])); del++; } i++; }
    else if (j<now.length && d.ins.has(j)){ flush(); if (String(now[j][1]).trim()){ out.push(row("add", now[j])); add++; } j++; }
    else { i++; j++; same++; }
  }

/* --- Final Draft export --- */
function toFDX(model, tp){
  const x = s => esc(s).replace(/'/g, "&apos;");
  const map = {s:"Scene Heading", a:"Action", c:"Character", p:"Parenthetical", d:"Dialogue", t:"Transition", h:"Shot"};
  const P = (ty, txt, attr) => `    <Paragraph Type="${ty}"${attr||""}>\n      <Text>${x(txt)}</Text>\n    </Paragraph>\n`;
  let out = "", prevSpeech = null, n = 0;
  const flushPrev = () => { if (prevSpeech!==null){ out += prevSpeech; prevSpeech = null; } };
  for (let i=0; i<model.length; i++){
    const [t, raw, id] = model[i]; const txt = String(raw).replace(/\s+$/,"");
    if (t==="c"){
      const dual = /\^\s*$/.test(txt); let sp = P("Character", txt.replace(/\s*\^\s*$/,""));
      while (i+1<model.length && "pd".includes(model[i+1][0])){ i++; const [tt, tx] = model[i]; const v = String(tx).trim(); if (!v) continue; sp += P(map[tt], tt==="p" && !/^\(/.test(v) ? "("+v+")" : v); }
      if (dual && prevSpeech!==null){ out += `    <Paragraph>\n      <DualDialogue>\n${prevSpeech.replace(/^/gm,"  ")}${sp.replace(/^/gm,"  ")}      </DualDialogue>\n    </Paragraph>\n`; prevSpeech = null; }
      else { flushPrev(); prevSpeech = sp; }
      continue;
    }
    if (!txt && t!=="s") continue;
    flushPrev();
    if (t==="s"){ n++; const num = S.sceneNums ? ` Number="${x((SCN && SCN.lab[id]) || String(n))}"` : ""; out += P("Scene Heading", txt.toUpperCase(), num); }
    else out += P(map[t] || "Action", t==="h" || t==="t" ? txt.toUpperCase() : txt);
  }
  flushPrev();
  const tpP = (txt, al) => txt ? txt.split("\n").map(l => `      <Paragraph Alignment="${al}" Type="General">\n        <Text>${x(l)}</Text>\n      </Paragraph>\n`).join("") : "";
  const tpx = tp && tp.title ? `  <TitlePage>\n    <Content>\n${tpP(tp.title.toUpperCase(),"Center")}${tpP(tp.credit||"","Center")}${tpP(tp.author||"","Center")}${tpP(tp.source||"","Center")}${tpP(tp.draft||"","Right")}${tpP(tp.contact||"","Left")}    </Content>\n  </TitlePage>\n` : "";
  return `<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n<FinalDraft DocumentType="Script" Template="No" Version="5">\n  <Content>\n${out}  </Content>\n${tpx}</FinalDraft>\n`;
}

/* --- read aloud (browser voices, free) --- */
let RA = null;
function stopReading(){ if (!RA) return; RA.stop = true; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll("#ed .el.speaking").forEach(x => x.classList.remove("speaking")); $("#raBar") && $("#raBar").remove(); RA = null; }
function readAloud(){
  if (!("speechSynthesis" in window)){ toast(T("Questo browser non sa leggere ad alta voce.")); return; }
  if (RA){ stopReading(); return; }
  const lang = S.lang || UI, vs = speechSynthesis.getVoices().filter(v => (v.lang||"").toLowerCase().startsWith(lang));
  const c = caret(); let i = c && ed.contains(c.el) ? c.i : lastCaret.i;
  while (i>0 && "pd".includes(ed.children[i]?.dataset.t)) i--;
  RA = {stop:false, map:{}, n:0};
  const bar = document.createElement("div"); bar.id = "raBar"; bar.innerHTML = `<span>${T("Lettura ad alta voce")}</span><button class="btn primary">■ ${T("Ferma")}</button>`;
  bar.querySelector("button").onclick = stopReading; document.body.appendChild(bar);
  const voiceFor = name => {
    if (!name) return {v: vs[0], p: 1};
    if (!RA.map[name]){ const k = ++RA.n; RA.map[name] = {v: vs.length>1 ? vs[k % vs.length] : vs[0], p: vs.length>1 ? 1 : [1.25, .8, 1.1, .9, 1.35, .7][k % 6]}; }
    return RA.map[name];
  };
  let spk = null;
  const next = () => {
    if (!RA || RA.stop) return;
    document.querySelectorAll("#ed .el.speaking").forEach(x => x.classList.remove("speaking"));
    const el = ed.children[i]; if (!el){ stopReading(); return; }
    const t = el.dataset.t, txt = getText(el).trim(); i++;
    if (t==="c") spk = charBase(txt); else if (t!=="d" && t!=="p") spk = null;
    if (!txt || t==="p" || t==="c" || t==="t"){ next(); return; }
    el.classList.add("speaking"); el.scrollIntoView({block:"center", behavior:"smooth"});
    const u = new SpeechSynthesisUtterance(t==="s" ? txt.replace(/^(INT|EXT|EST|I\/E)\.?\s*/i, "") : txt);
    const vv = voiceFor(t==="d" ? spk : null); if (vv.v) u.voice = vv.v; u.lang = (vv.v && vv.v.lang) || lang; u.pitch = vv.p; u.rate = 1.02;
    u.onend = () => setTimeout(next, 120); u.onerror = () => { if (RA && !RA.stop) setTimeout(next, 50); };
    speechSynthesis.speak(u);
  };
  next();
}

  const [db, user] = await Promise.all([useCap("db"), useCap("user")]);
  USER = user; DB = await rtReady(); if (DB) watchConnection();
  let userId = null; if (db && user){ try{ userId = await user.id(); }catch(e){} }
  if (user){ try{ ME = await user.me(); const av = $("#meAvatar"); if (ME && ME.avatarUrl){ av.src = ME.avatarUrl; av.hidden = false; } }catch(e){} }
  Store = (db && userId) ? makeDBStore(db, userId) : LocalStore;
  let list = [];
  try{ list = await Store.list(); }catch(e){ Store = LocalStore; list = await LocalStore.list(); }
  setSaveStatus(cur.isSample ? (Store===LocalStore ? T("Esempio · si salva su questo dispositivo quando scrivi") : T("Esempio · si salva nel cloud quando scrivi")) : Store.label, Store===LocalStore?"local":"");
  const hm = BOOT_HASH.match(/^#c-([a-z0-9]+)$/);
  if (hm && DB){ await openShared(hm[1]); return; }
  if (list.length && cur.isSample && !dirty){
    const last = lsGet("abt:last"); const pick = list.find(x=>x.id===last) || list[0];
    await openScript(pick.id);
  }
}
boot();
</script>
