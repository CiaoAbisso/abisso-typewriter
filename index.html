<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff0000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff0000'/%3E%3Crect x='9' y='7' width='7' height='18' fill='%23fff'/%3E%3C/svg%3E">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typewriter">
<script src="config.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol==="https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<title>Abisso Typewriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: writing desk — app chrome around a single page of paper; breakdown view swaps the desk for strip-board rows */
/* Layout: carta bianca e inchiostro nero, con il rosso pieno del sito abissostudio.it come unico accento; la pagina del copione al centro con un bordo sottile. Pagina scura opzionale per scrivere di notte. */
:root{
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f4f4f5; --paper:#ffffff; --ink:#000000; --muted:#6b6b70; --line:#e1e1e5;
  --red:#ff0000; --red-ink:#d90000; --accent:#ff0000; --accent-ink:#ffffff; --accent-soft:#ffecec; --mark:#d90000;
  --s-intd:#ffffff; --s-extd:#ffa3a3; --s-intn:#6b6b70; --s-extn:#000000; --danger:#d90000; --desk:#e9e9ed;
  --f-ui:Helvetica, Arial, sans-serif;
  --f-script:"Courier Prime", "Courier New", Courier, monospace;
  --lh:1.2em; --r:10px; --zoom:1;
  --shadow:0 0 0 1px #e1e1e5, 0 10px 30px rgba(0,0,0,.06);
  color-scheme:light;
}
html.mode-dark{
  --bg:#0b051d; --panel:#100728; --panel-2:#1b1140; --paper:#170d36; --ink:#ffffff; --muted:#a79dc2; --line:#2f2456;
  --red:#ff0000; --red-ink:#ff4040; --accent:#ff0000; --accent-ink:#ffffff; --accent-soft:#2a1b52; --mark:#ff4040;
  --s-intd:#ffffff; --s-extd:#ff8080; --s-intn:#6c5ca0; --s-extn:#ff0000; --danger:#ff4040; --desk:#06020f;
  --shadow:0 0 0 1px #2f2456, 0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}


html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.tb.cycle{color:var(--red-ink);border-color:var(--red)}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
.app > .top{grid-row:1}.app > .typebar{grid-row:2}.app > .main{grid-row:3}.app > .status{grid-row:4}

/* header */
.top{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:2px solid var(--red);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:center;gap:0;white-space:nowrap;flex:none;font-family:var(--f-script);font-size:15px;letter-spacing:.06em;color:var(--ink);line-height:1}
.brand .w1{font-weight:700;color:var(--red-ink)}
.brand .w2{margin-left:.6em}
.brand .cur{display:inline-block;width:.55em;height:1.05em;background:var(--red);margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.brand .cur{animation:none}}
.title-input{flex:1 1 160px;min-width:0;max-width:360px;border:1px solid transparent;background:transparent;border-radius:0;padding:6px 8px;font-weight:700;font-size:15px}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);background:var(--paper);outline:none}
.spacer{flex:1}
.btn{border:1.5px solid var(--ink);color:var(--ink);background:var(--panel);border-radius:var(--r);padding:7px 12px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn.primary{background:var(--red);color:var(--accent-ink);border-color:var(--red);font-weight:700}
.btn.primary:hover{background:var(--panel);color:var(--red)}
.btn.icon{padding:5px 10px;line-height:1;font-size:14px;letter-spacing:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.title-input:focus{background:var(--panel-2)!important}

/* type bar */
.typebar{display:flex;align-items:center;gap:4px;background:var(--panel-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.typebar::-webkit-scrollbar{display:none}
.tb{flex:none;border:1px solid transparent;background:transparent;border-radius:0;padding:5px 9px;display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tb:hover{background:var(--panel)}
.tb{border-radius:8px}
.tb.on{background:var(--red);border-color:var(--red);color:var(--accent-ink)}
.tb.on kbd{color:var(--accent-ink);border-color:var(--accent-ink);background:transparent}
.tb.on .dot{background:var(--accent-ink)}
.tb .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
kbd{font-family:var(--f-ui);font-size:10px;letter-spacing:0;color:var(--muted);border:1px solid var(--line);padding:0 4px;background:var(--panel)}
.tb-sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 4px}
.only-m{display:none}

/* main */
.main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-tabs{display:flex;gap:2px;padding:10px 12px 6px}
.side-tabs button{flex:1;border:0;border-bottom:2px solid var(--line);background:transparent;padding:8px 6px;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.side-tabs button.on{border-bottom-color:var(--red);color:var(--ink)}
.side-list{overflow:auto;padding:4px 8px 16px;flex:1;min-height:0}
.sc{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 6px}
.sc:hover{background:var(--panel-2)}
.sc.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--red)}
.sc.cur .n{color:var(--red-ink)}
.sc .n{font-family:var(--f-script);font-weight:700;color:var(--muted);text-align:right}
.sc .h{min-width:0}
.sc .h b{display:block;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .h i{font-style:normal;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.sc .pg{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty-note{color:var(--muted);padding:12px 8px;font-size:13px;line-height:1.5}

/* editor */
.write{min-height:0;position:relative}
.scroller{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.paper{position:relative;margin:32px auto 140px;font-size:calc(15.5px * var(--zoom))!important;width:85ch;max-width:calc(100% - 32px);background:var(--paper);color:var(--ink);
  font-family:var(--f-script);font-size:15.5px;line-height:var(--lh);padding:6em 10ch 8em 15ch;box-shadow:var(--shadow);border-radius:2px}
#ed{outline:none;counter-reset:sc;caret-color:var(--red);min-height:30em}
.el{position:relative;white-space:pre-wrap;overflow-wrap:break-word;min-height:var(--lh)}
.el + .el{margin-top:var(--lh)}
.el.t-s{text-transform:uppercase;counter-increment:sc}
#ed.sp2 .el.t-s:not(:first-child){margin-top:calc(var(--lh) * 2)}
#ed.bold .el.t-s{font-weight:700}
#ed.nums .el.t-s::after{content:counter(sc);position:absolute;left:-6ch;top:0;color:var(--mark);font-weight:700}
.el.t-c{margin-left:22ch;text-transform:uppercase}
.el.t-p{margin-left:15ch;max-width:25ch}
.el.t-d{margin-left:10ch;max-width:35ch}
.el.t-c + .el.t-d,.el.t-c + .el.t-p,.el.t-p + .el.t-d,.el.t-d + .el.t-p,.el.t-p + .el.t-p,.el.t-d + .el.t-d{margin-top:0}
.el.t-t{text-align:right;text-transform:uppercase}
.el.t-h{text-transform:uppercase}
.el.ph::before{content:attr(data-ph);position:absolute;left:0;top:0;color:var(--muted);opacity:.55;pointer-events:none;text-transform:none;white-space:nowrap}
.el.t-t.ph::before{left:auto;right:0}
.marks{position:absolute;inset:0;pointer-events:none;z-index:0}
#ed{position:relative;z-index:1}
/* page view: real sheets, gaps between pages */
.write.pages .scroller{background:var(--desk)}
.write.pages .paper{--lh:1em;box-sizing:border-box;width:var(--pw,85ch);max-width:none;background:transparent;box-shadow:none;border-radius:0;line-height:1em;
  font-size:calc(16px * var(--zoom))!important;padding:6em calc(var(--pw,85ch) - 75ch) 0 15ch;margin:24px auto 40vh}
.write.pages .shbar{margin-bottom:0}
.sheet{position:absolute;left:0;right:0;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
html.mode-dark .sheet{box-shadow:0 0 0 1px var(--line)}
.pnum,.plab{position:absolute;white-space:pre;font-family:var(--f-script);color:var(--ink);line-height:1em}
.pnum{color:var(--muted)}
.plab{color:var(--muted)}
.pgap{display:block;pointer-events:none;user-select:none}
.tb.on-mode{color:var(--red-ink);border-color:var(--red)}
.pm{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.pm span{position:absolute;right:10px;top:-.65em;background:var(--paper);color:var(--mark);font-family:var(--f-ui);font-size:10px;font-weight:700;padding:0 4px;letter-spacing:.04em}

.ac{position:absolute;z-index:5;min-width:220px;max-width:min(360px,90%);background:var(--panel);color:var(--ink);border:1px solid var(--red);border-radius:8px;box-shadow:var(--shadow);padding:4px;font-family:var(--f-script);font-size:14px}
.ac button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac button.sel{background:var(--red);color:#ffffff}

/* status */
.status{display:flex;gap:16px;align-items:center;background:var(--panel);border-top:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));white-space:nowrap;overflow:hidden}
.status .save{margin-left:auto;display:flex;gap:6px;align-items:center}
.status .save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.status .save.err{color:var(--red-ink)}
.status .save.err::before{border-color:var(--red)!important}
.status .save.busy::before{background:transparent;border:1px solid var(--ink);box-sizing:border-box}
.status .save.local::before{background:var(--muted)}
.status .save.err::before{background:transparent;border:2px solid var(--ink);border-radius:0;box-sizing:border-box}
.status .save.err{color:var(--ink);font-weight:700}

/* breakdown */
.bd{min-height:0;overflow:auto;grid-column:1 / -1}
.bd-in{max-width:1100px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bd-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bd-head h2{margin:0;color:var(--red-ink);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-right:auto;text-wrap:balance}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig{background:var(--panel);padding:10px 12px}
.fig b{display:block;color:var(--red-ink);font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-weight:700}
.fig span{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.ai-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px}
.ai-bar p{margin:0;flex:1 1 260px;color:var(--muted);line-height:1.45;min-width:0}
.prog{height:3px;background:var(--line);overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.bd-tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.bd-tabs button{border:0;background:transparent;padding:9px 12px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.bd-tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.bd-tabs select{margin-left:auto;border:1.5px solid var(--ink);background:var(--panel);border-radius:8px;padding:5px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:10px;border:1px solid var(--muted)}
.strips{display:flex;flex-direction:column;gap:6px}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip.open{border-color:var(--red)}
.strip-row{display:grid;grid-template-columns:14px 3.2em 6.5em minmax(0,1fr) 4.5em minmax(0,1.1fr) 24px;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:0 10px 0 0;min-height:44px}
.strip-row .bar{align-self:stretch;border-right:1px solid var(--line)}
.strip-row .n{font-family:var(--f-script);font-weight:700;font-size:15px;text-align:right;color:var(--red-ink)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--ink);border-radius:4px;white-space:nowrap}
.strip-row .loc{min-width:0}
.strip-row .loc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.strip-row .loc small{color:var(--muted)}
.strip-row .e8{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.strip-row .who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.strip-row .car{color:var(--muted);transition:transform .15s}
.strip.open .car{transform:rotate(90deg)}
.strip-body{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 18px}
.cat h4{margin:0 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:4px;padding:2px 2px 2px 7px;font-size:12.5px}
.tag button{border:0;background:transparent;color:var(--muted);padding:0 5px;font-size:14px;line-height:1}
.tag-add{border:1px dashed var(--muted);background:transparent;padding:2px 6px;font-size:12px;width:9em;min-width:0}
.ai-note{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.45}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ffffff;font-weight:700;background:var(--red)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 64px);overflow:auto;background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.modal h3{margin:0 0 16px;font-size:22px;letter-spacing:-.01em;color:var(--red-ink)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 10px;font-size:16px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);outline:none}
.field textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-of-type{border-bottom:0}
.check span{flex:1}
.check small{display:block;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:6px}
.sitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.sitem.cur{border-color:var(--red)}
.sitem div{flex:1;min-width:0}
.sitem b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--muted)}
.sitem .btn{padding:5px 8px;font-size:10px}
.btn.danger{border-style:dashed}
.menu{position:fixed;z-index:21;background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:7px}
.menu button:hover{background:var(--red);color:#ffffff}
.menu button:hover small{color:#ffffff!important}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.langs{display:flex;gap:4px;padding:4px}
.langs + .langs{padding-top:0}
/* find and replace */
.findbar{position:absolute;z-index:8;top:10px;right:max(16px,env(safe-area-inset-right,0px));width:min(430px,calc(100% - 32px));background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.fb-row{display:flex;gap:6px;align-items:center;min-width:0}
.fb-row input[type=search],.fb-row input[type=text]{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:15px}
.fb-row input:focus{border-color:var(--red);outline:none}
.fb-count{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
.fb-count.none{color:var(--red-ink)}
.fb-ib{flex:none;width:32px;height:32px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:15px;line-height:1;display:grid;place-items:center}
.fb-ib:hover{border-color:var(--ink)}
.fb-ib.on{border-color:var(--red);color:var(--red-ink)}
.fb-btn{flex:none;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.fb-btn:hover{background:var(--ink);color:var(--bg)}

я прочитати. Спробуйте ще раз: продовжу з тих сцен, яких бракує."}, "Analisi interrotta. Riprova più tardi.": {"en": "Analysis stopped. Try again later.", "de": "Analyse abgebrochen. Versuche es später erneut.", "fr": "Analyse interrompue. Réessayez plus tard.", "es": "Análisis interrumpido. Vuelve a intentarlo más tarde.", "uk": "Аналіз перервано. Спробуйте пізніше."}, "Pagina": {"en": "Page", "de": "Seite", "fr": "Page", "es": "Página", "uk": "Сторінка"}, "Momento": {"en": "Time", "de": "Tageszeit", "fr": "Moment", "es": "Momento", "uk": "Час доби"}, "Ottavi": {"en": "Eighths", "de": "Achtel", "fr": "Huitièmes", "es": "Octavos", "uk": "Восьмі"}, "Note": {"en": "Notes", "de": "Notizen", "fr": "Notes", "es": "Notas", "uk": "Нотатки"}, "spoglio": {"en": "breakdown", "de": "auszug", "fr": "dépouillement", "es": "desglose", "uk": "розбивка"}, "fogli di spoglio": {"en": "breakdown sheets", "de": "auszugsboegen", "fr": "fiches de dépouillement", "es": "hojas de desglose", "uk": "аркуші розбивки"}, "Il motore PDF non è ancora caricato.": {"en": "The PDF engine hasn't loaded yet.", "de": "Die PDF-Funktion ist noch nicht geladen.", "fr": "Le module PDF n'est pas encore chargé.", "es": "El motor PDF aún no se ha cargado.", "uk": "Модуль PDF ще не завантажився."}, "FOGLIO DI SPOGLIO": {"en": "BREAKDOWN SHEET", "de": "AUSZUGSBOGEN", "fr": "FICHE DE DÉPOUILLEMENT", "es": "HOJA DE DESGLOSE", "uk": "АРКУШ РОЗБИВКИ"}, "pagina {p}  ·  {e} di pagina": {"en": "page {p}  ·  {e} of a page", "de": "Seite {p}  ·  {e} Seite", "fr": "page {p}  ·  {e} de page", "es": "página {p}  ·  {e} de página", "uk": "сторінка {p}  ·  {e} сторінки"}, "NOTE": {"en": "NOTES", "de": "NOTIZEN", "fr": "NOTES", "es": "NOTAS", "uk": "НОТАТКИ"}, "Nessuna scena da esportare.": {"en": "No scenes to export.", "de": "Keine Szenen zum Exportieren.", "fr": "Aucune scène à exporter.", "es": "No hay escenas para exportar.", "uk": "Немає сцен для експорту."}, "Nuovo copione": {"en": "New script", "de": "Neues Drehbuch", l'historique à côté de vos modifications, et aux autres pendant que vous êtes dans le scénario.", "es": "Tu nombre aparece en el historial junto a tus cambios y, para los demás, mientras estás en el guion.", "uk": "Ваше ім'я з'являється в історії поруч із вашими змінами, а також для інших, поки ви в сценарії."}, "Nome": {"en": "Name", "de": "Name", "fr": "Nom", "es": "Nombre", "uk": "Ім'я"}, "Entra": {"en": "Enter", "de": "Weiter", "fr": "Entrer", "es": "Entrar", "uk": "Увійти"}, "I copioni condivisi si aprono solo dalla pagina su claude.ai, con il tuo account.": {"en": "Shared scripts open only from the page on claude.ai, with your account.", "de": "Geteilte Drehbücher öffnen sich nur auf der Seite in claude.ai, mit deinem Konto.", "fr": "Les scénarios partagés s'ouvrent uniquement depuis la page sur claude.ai, avec votre compte.", "es": "Los guiones compartidos solo se abren desde la página en claude.ai, con tu cuenta.", "uk": "Спільні сценарії відкриваються лише зі сторінки на claude.ai, з вашим обліковим записом."}, "Questo copione condiviso non esiste più, oppure non hai accesso.": {"en": "This shared script no longer exists, or you don't have access.", "de": "Dieses geteilte Drehbuch existiert nicht mehr oder du hast keinen Zugriff.", "fr": "Ce scénario partagé n'existe plus, ou vous n'y avez pas accès.", "es": "Este guion compartido ya no existe o no tienes acceso.", "uk": "Цього спільного сценарію більше немає, або у вас немає доступу."}, "Solo lettura: chiedi a chi ti ha mandato il link di invitarti come Editor": {"en": "Read only: ask whoever sent you the link to invite you as an Editor", "de": "Nur lesen: bitte die Person, die dir den Link geschickt hat, dich als Editor einzuladen", "fr": "Lecture seule : demandez à la personne qui vous a envoyé le lien de vous inviter comme Éditeur", "es": "Solo lectura: pide a quien te envió el enlace que te invite como Editor", "uk": "Лише перегляд: попросіть того, хто надіслав посилання, запросити вас як редактора"}, Link an die Person.", "fr": "Envoyez le lien à la personne.", "es": "Envía el enlace a la persona.", "uk": "Надішліть посилання людині."}, "Su claude.ai apri il menu <b>Condividi</b> di questa pagina e invita la persona con la sua email come <b>Editor</b>. Basta farlo una volta per persona: vale per tutti i copioni condivisi.": {"en": "On claude.ai, open this page's <b>Share</b> menu and invite the person by email as an <b>Editor</b>. Once per person is enough: it covers every shared script.", "de": "Öffne auf claude.ai das Menü <b>Teilen</b> dieser Seite und lade die Person per E-Mail als <b>Editor</b> ein. Einmal pro Person reicht: Es gilt für alle geteilten Drehbücher.", "fr": "Sur claude.ai, ouvrez le menu <b>Partager</b> de cette page et invitez la personne par e-mail comme <b>Éditeur</b>. Une fois par personne suffit : cela vaut pour tous les scénarios partagés.", "es": "En claude.ai, abre el menú <b>Compartir</b> de esta página e invita a la persona por correo como <b>Editor</b>. Basta una vez por persona: vale para todos los guiones compartidos.", "uk": "На claude.ai відкрийте меню <b>Поділитися</b> цієї сторінки й запросіть людину електронною поштою як <b>редактора</b>. Достатньо одного разу для кожної людини: це діє для всіх спільних сценаріїв."}, "Chi apre il link entra con il suo account Claude, scrive il suo nome e può modificare. Ogni modifica finisce nella cronologia con il suo nome.": {"en": "Whoever opens the link signs in with their Claude account, types their name and can edit. Every change goes into the history with their name.", "de": "Wer den Link öffnet, meldet sich mit dem eigenen Claude-Konto an, gibt den Namen ein und kann bearbeiten. Jede Änderung landet mit dem Namen im Verlauf.", "fr": "La personne qui ouvre le lien se connecte avec son compte Claude, écrit son nom et peut modifier. Chaque modification va dans l'historique avec son nom.", "es": "Quien abre el enlace entra con su cuenta de Claude, escribe su nombre y puede editar. Cada cambio queda en el historial con su nombre.", "uk": "Той, хто відкриває посилання, входить зі своїм обліковим записом Claude, пише своє ім'я й може редагувати. Кожна зміна потрапляє в історію з його ім'ям."}, "Non attivare il link pubblico della pagina: con il link pubblico chi è fuori dalla tua organizzazione può solo leggere.": {"en": "Don't turn on the page's public link: through a public link, people outside your organisation can only read.", "de": "Aktiviere nicht den öffentlichen Link der Seite: Über den öffentlichen Link können Personen außerhalb deiner Organisation nur lesen.", "fr": "N'activez pas le lien public de la page : avec le lien public, les personnes extérieures à votre organisation peuvent seulement lire.", "es": "No actives el enlace público de la página: con el enlace público, quien está fuera de tu organización solo puede leer.", "uk": "Не вмикайте публічне посилання сторінки: через нього люди поза вашою організацією можуть лише читати."}, "Link copiato.": {"en": "Link copied.", "de": "Link kopiert.", "fr": "Lien copié.", "es": "Enlace copiado.", "uk": "Посилання скопійовано."}, "Seleziona il link e copialo.": {"en": "Select the link and copy it.", "de": "Markiere den Link und kopiere ihn.", "fr": "Sélectionnez le lien et copiez-le.", "es": "Selecciona el enlace y cópialo.", "uk": "Виділіть посилання й скопіюйте його."}, "Cronologia delle modifiche": {"en": "Change history", "de": "Änderungsverlauf", "fr": "Historique des modifications", "es": "Historial de cambios", "uk": "Історія змін"}, "Caricamento…": {"en": "Loading…", "de": "Wird geladen…", "fr": "Chargement…", "es": "Cargando…", "uk": "Завантаження…"}, "Nessuna modifica registrata finora.": {"en": "No changes recorded yet.", "de": "Bisher keine Änderungen erfasst.", "fr": "Aucune modification enregistrée pour l'instant.", "es": "Todavía no hay cambios registrados.", "uk": "Змін ще не зафіксовано."}, "ha condiviso il copione": {"en": "shared the script", "de": "hat das Drehbuch geteilt", "fr": "a partagé le scénario", "es": "compartió el guion", "uk": "поділився сценарієм"}, "ha ripristinato una versione precedente": {"en": "restored an earlier version", "de": "hat eine frühere Version wiederhergestellt", "fr": "a restauré une version précédente", "es": "restauró una versión anterior", "uk": "відновив попередню версію"}, "parole": {"en": "words", "de": "Wörter", "fr": "mots", "es": "palabras", "uk": "слів"}, "modifiche di formato": {"en": "formatting changes", "de": "Formatänderungen", "fr": "modifications de mise en forme", "es": "cambios de formato", "uk": "зміни форматування"}, "Ripristina": {"en": "Restore", "de": "Wiederherstellen", "fr": "Restaurer", "es": "Restaurar", "uk": "Відновити"}, "Ogni riga raccoglie le modifiche di una persona in un arco di 10 minuti. Ripristinare crea una nuova voce: non si perde niente.": {"en": "Each row groups one person's changes over 10 minutes. Restoring adds a new entry: nothing is lost.", "de": "Jede Zeile fasst die Änderungen einer Person über 10 Minuten zusammen. Wiederherstellen legt einen neuen Eintrag an: Nichts geht verloren.", "fr": "Chaque ligne regroupe les modifications d'une personne sur 10 minutes. Restaurer crée une nouvelle entrée : rien n'est perdu.", "es": "Cada fila agrupa los cambios de una persona durante 10 minutos. Restaurar crea una entrada nueva: no se pierde nada.", "uk": "Кожен рядок об'єднує зміни однієї людини за 10 хвилин. Відновлення створює новий запис: нічого не втрачається."}, "Versione ripristinata.": {"en": "Version restored.", "de": "Version wiederhergestellt.", "fr": "Version restaurée.", "es": "Versión restaurada.", "uk": "Версію відновлено."}, "Aggiornato da {n}": {"en": "Updated by {n}", "de": "Aktualisiert von {n}", "fr": "Mis à jour par {n}", "es": "Actualizado por {n}", "uk": "Оновлено: {n}"}, "Salvato · copione condiviso": {"en": "Saved · shared script", "de": "Gespeichert · geteiltes Drehbuch", "fr": "Enregistré · scénario partagé", "es": "Guardado · guion compartido", "uk": "Збережено · спільний сценарій"}, "Link e inviti": {"en": "Link and invitations", "de": "Link und Einladungen", "fr": "Lien et invitations", "es": "Enlace e invitaciones", "uk": "Посилання й запрошення"}, "Condividi questo copione": {"en": "Share this script", "de": "Dieses Drehbuch teilen", "fr": "Partager ce scénario", "es": "Compartir este guion", "uk": "Поділитися цим сценарієм"}, "Condividi": {"en": "Share", "de": "Teilen", "fr": "Partager", "es": "Compartir", "uk": "Поділитися"}, "Copioni condivisi": {"en": "Shared scripts", "de": "Geteilte Drehbücher", "fr": "Scénarios partagés", "es": "Guiones compartidos", "uk": "Спільні сценарії"}, "Nessun copione condiviso. Apri un tuo copione e usa Condividi: chi riceve il link può scriverci insieme a te.": {"en": "No shared scripts. Open one of yours and use Share: whoever gets the link can write it with you.", "de": "Keine geteilten Drehbücher. Öffne eines deiner Drehbücher und nutze Teilen: Wer den Link bekommt, kann mit dir daran schreiben.", "fr": "Aucun scénario partagé. Ouvrez l'un de vos scénarios et utilisez Partager : la personne qui reçoit le lien peut l'écrire avec vous.", "es": "Ningún guion compartido. Abre uno de tus guiones y usa Compartir: quien reciba el enlace podrá escribirlo contigo.", "uk": "Спільних сценаріїв немає. Відкрийте свій сценарій і натисніть «Поділитися»: той, хто отримає посилання, зможе писати разом із вами."}, "Ultima modifica: {n}, {d}": {"en": "Last edit: {n}, {d}", "de": "Zuletzt geändert: {n}, {d}", "fr": "Dernière modification : {n}, {d}", "es": "Última modificación: {n}, {d}", "uk": "Остання зміна: {n}, {d}"}, "Il tuo nome nei copioni condivisi": {"en": "Your name in shared scripts", "de": "Dein Name in geteilten Drehbüchern", "fr": "Votre nom dans les scénarios partagés", "es": "Tu nombre en los guiones compartidos", "uk": "Ваше ім'я у спільних сценаріях"}, "I tuoi copioni li vedi solo tu. Quando ne condividi uno, diventa un copione condiviso: chi ha il link e il tuo invito come Editor ci scrive insieme a te, e ogni modifica resta nella cronologia con il nome di chi l'ha fatta.": {"en": "Only you see your scripts. When you share one, it becomes a shared script: anyone with the link and your Editor invitation writes it with you, and every change stays in the history with the name of who made it.", "de": "Deine Drehbücher siehst nur du. Wenn du eines teilst, wird es ein geteiltes Drehbuch: Wer den Link und deine Einladung als Editor hat, schreibt mit dir daran, und jede Änderung bleibt mit dem Namen der Person im Verlauf.", "fr": "Vous seul voyez vos scénarios. Quand vous en partagez un, il devient un scénario partagé : les personnes ayant le lien et votre invitation comme Éditeur l'écrivent avec vous, et chaque modification reste dans l'historique avec le nom de son auteur.", "es": "Tus guiones solo los ves tú. Cuando compartes uno, se convierte en un guion compartido: quien tiene el enlace y tu invitación como Editor lo escribe contigo, y cada cambio queda en el historial con el nombre de quien lo hizo.", "uk": "Ваші сценарії бачите лише ви. Коли ви ділитеся сценарієм, він стає спільним: ті, хто має посилання й ваше запрошення як редактора, пишуть його разом із вами, а кожна зміна залишається в історії з ім'ям автора."}, "Nome salvato.": {"en": "Name saved.", "de": "Name gespeichert.", "fr": "Nom enregistré.", "es": "Nombre guardado.", "uk": "Ім'я збережено."}, "Nei copioni condivisi lo spoglio lo gestisce solo chi ha condiviso il copione.": {"en": "In shared scripts, only the person who shared the script manages the breakdown.", "de": "In geteilten Drehbüchern verwaltet nur die Person, die das Drehbuch geteilt hat, den Auszug.", "fr": "Dans les scénarios partagés, seule la personne qui a partagé le scénario gère le dépouillement.", "es": "En los guiones compartidos, solo quien compartió el guion gestiona el desglose.", "uk": "У спільних сценаріях розбивкою керує лише той, хто поділився сценарієм."}, "Vista a pagine": {"en": "Page орінкою: якщо сценарій поширять, буде видно, з якої копії."}, "La scaletta si riempie quando scrivi la prima scena.": {"en": "The outline fills up when you write the first scene.", "de": "Die Szenenübersicht füllt sich, sobald du die erste Szene schreibst.", "fr": "Le séquencier se remplit dès que tu écris la première scène.", "es": "La escaleta se llena cuando escribes la primera escena.", "uk": "План заповнюється, коли ти пишеш першу сцену."}, "Lettura ad alta voce": {"en": "Reading aloud", "de": "Vorlesen", "fr": "Lecture à voix haute", "es": "Lectura en voz alta", "uk": "Читання вголос"}, "Metti il cursore sul nome del secondo personaggio, quello che parla insieme al primo.": {"en": "Put the cursor on the second character's name, the one speaking at the same time as the first.", "de": "Setze den Cursor auf den Namen der zweiten Figur, die gleichzeitig mit der ersten spricht.", "fr": "Place le curseur sur le nom du second personnage, celui qui parle en même temps que le premier.", "es": "Pon el cursor en el nombre del segundo personaje, el que habla a la vez que el primero.", "uk": "Постав курсор на ім'я другого персонажа, який говорить одночасно з першим."}, "Metti il cursore sulla riga da commentare.": {"en": "Put the cursor on the line you want to comment on.", "de": "Setze den Cursor auf die Zeile, die du kommentieren willst.", "fr": "Place le curseur sur la ligne à commenter.", "es": "Pon el cursor en la línea que quieres comentar.", "uk": "Постав курсор на рядок, який хочеш прокоментувати."}, "Modalità concentrazione": {"en": "Focus mode", "de": "Fokusmodus", "fr": "Mode concentration", "es": "Modo concentración", "uk": "Режим зосередження"}, "Modalità concentrazione disattivata.": {"en": "Focus mode off.", "de": "Fokusmodus aus.", "fr": "Mode concentration désactivé.", "es": "Modo concentración desactivado.", "uk": "Режим зосередження вимкнено."}, "Modalità concentrazione: la riga attiva resta al centro.": {"en": "Focus mode: the active line stays in the middle.", "de": "Fokusmodus: Die aktive Zeile bleibt in der Mitte.", "fr": "Mode concentration : la ligne active reste au centre.", "es": "Modo concentración: la línea activa se queda en el centro.", "uk": "Режим зосередження: активний рядок лишається посередині."}, "Mostra gli asterischi nel copione": {"en": "Show asterisks in the script", "de": "Sternchen im Drehbuch zeigen", "fr": "Afficher les astérisques dans le scénario", "es": "Mostrar los asteriscos en el guion", "uk": "Показувати зірочки в сценарії"}, "Nessuna differenza.": {"en": "No differences.", "de": "Keine Unterschiede.", "fr": "Aucune différence.", "es": "Ninguna diferencia.", "uk": "Різниці немає."}, "Nessuna nota. Metti il cursore su una riga e scegli Aggiungi nota dal menu ⋯ ({k}).": {"en": "No notes. Put the cursor on a line and choose Add note from the ⋯ menu ({k}).", "de": "Keine Notizen. Setze den Cursor auf eine Zeile und wähle Notiz hinzufügen im Menü ⋯ ({k}).", "fr": "Aucune note. Place le curseur sur une ligne et choisis Ajouter une note dans le menu ⋯ ({k}).", "es": "Sin notas. Pon el cursor en una línea y elige Añadir nota en el menú ⋯ ({k}).", "uk": "Нотаток немає. Постав курсор на рядок і вибери «Додати нотатку» в меню ⋯ ({k})."}, "Nessuna versione salvata.": {"en": "No saved versions.", "de": "Keine gespeicherten Fassungen.", "fr": "Aucune version enregistrée.", "es": "Ninguna versión guardada.", "uk": "Збережених версій немає."}, "Nessuno": {"en": "None", "de": "Keins", "fr": "Aucun", "es": "Ninguno", "uk": "Немає"}, "Nota aggiunta.": {"en": "Note added.", "de": "Notiz hinzugefügt.", "fr": "Note ajoutée.", "es": "Nota añadida.", "uk": "Нотатку додано."}, "Obiettivo giornaliero (parole)": {"en": "Daily goal (words)", "de": "Tagesziel (Wörter)", "fr": "Objectif quotidien (mots)", "es": "Objetivo diario (palabras)", "uk": "Щоденна мета (слова)"}, "Produzione": {"en": "Production", "de": "Produktion", "fr": "Production", "es": "Producción", "uk": "Виробництво"}, "Quando il copione va in produzione, bloccalo: i numeri di scena restano fissi (le scene nuove diventano 12A, 12B; quelle tolte restano come OMESSA) e ogni modifica viene segnata con un asterisco e il colore della revisione.": {"en": "When the script goes into production, lock it: scene numbers stay fixed (new scenes become 12A, 12B; removed ones stay as OMITTED) and every change is marked with an asterisk and the revision colour.", "de": "Wenn das Drehbuch in Produktion geht, sperre es: Die Szenennummern bleiben fest (neue Szenen werden 12A, 12B; gestrichene bleiben als ENTFÄLLT stehen) und jede Änderung wird mit einem Sternchen und der Revisionsfarbe markiert.", "fr": "Quand le scénario part en production, verrouille-le : les numéros de scène restent fixes (les nouvelles scènes deviennent 12A, 12B ; celles retirées restent comme SUPPRIMÉE) et chaque modification est marquée d'un astérisque et de la couleur de révision.", "es": "Cuando el guion pasa a producción, bloquéalo: los números de escena quedan fijos (las escenas nuevas pasan a ser 12A, 12B; las quitadas quedan como OMITIDA) y cada cambio se marca con un asterisco y el color de la revisión.", "uk": "Коли сценарій іде у виробництво, заблокуй його: номери сцен лишаються незмінними (нові сцени стають 12A, 12B; вилучені лишаються як ВИЛУЧЕНО), а кожну зміну позначено зірочкою й кольором редакції."}, "Questa versione non è disponibile offline.": {"en": "This version isn't available offline.", "de": "Diese Fassung ist offline nicht verfügbar.", "fr": "Cette version n'est pas disponible hors ligne.", "es": "Esta versión no está disponible sin conexión.", "uk": "Ця версія недоступна офлайн."}, "Questo browser non sa leggere ad alta voce.": {"en": "This browser can't read aloud.", "de": "Dieser Browser kann nicht vorlesen.", "fr": "Ce navigateur ne sait pas lire à voix haute.", "es": "Este navegador no puede leer en voz alta.", "uk": "Цей браузер не вміє читати вголос."}, "Revisione in corso": {"en": "Current revision", "de": "Laufende Revision", "fr": "Révision en cours", "es": "Revisión en curso", "uk": "Поточна редакція"}, "Revisione {a} chiusa. Le prossime modifiche sono {b}.": {"en": "{a} revision closed. Your next changes are {b}.", "de": "Revision {a} abgeschlossen. Die nächsten Änderungen sind {b}.", "fr": "Révision {a} clôturée. Les prochaines modifications sont {b}.", "es": "Revisión {a} cerrada. Los próximos cambios son {b}.", "uk": "Редакцію «{a}» закрито. Наступні зміни — «{b}»."}, "Riapri": {"en": "Reopen", "de": "Wieder öffnen", "fr": "Rouvrir", "es": "Reabrir", "uk": "Відкрити знову"}, "Riga vuota": {"en": "Empty line", "de": "Leere Zeile", "fr": "Ligne vide", "es": "Línea vacía", "uk": "Порожній рядок"}, "Salva una fotografia del copione con un nome, per esempio prima di una consegna. Puoi confrontarla con il testo attuale o ripristinarla.": {"en": "Save a named snapshot of the script, for example before a delivery. You can compare it with the current text or restore it.", "de": "Speichere eine benannte Momentaufnahme des Drehbuchs, zum Beispiel vor einer Abgabe. Du kannst sie mit dem aktuellen Text vergleichen oder wiederherstellen.", "fr": "Enregistre une photo nommée du scénario, par exemple avant une livraison. Tu peux la comparer au texte actuel ou la restaurer.", "es": "Guarda una foto del guion con un nombre, por ejemplo antes de una entrega. Puedes compararla con el texto actual o restaurarla.", "uk": "Збережи знімок сценарію з назвою, наприклад перед здачею. Його можна порівняти з поточним текстом або відновити."}, "Salva versione": {"en": "Save version", "de": "Fassung speichern", "fr": "Enregistrer la version", "es": "Guardar versión", "uk": "Зберегти версію"}, "Sblocca": {"en": "Unlock", "de": "Entsperren", "fr": "Déverrouiller", "es": "Desbloquear", "uk": "Розблокувати"}, "Scaletta": {"en": "Outline", "de": "Übersicht", "fr": "Séquencier", "es": "Escaleta", "uk": "План"}, "Scarica PDF": {"en": "Download PDF", "de": "PDF herunterladen", "fr": "Télécharger le PDF", "es": "De function parseHeading(h){
  const u = String(h).toUpperCase().trim();
  const m = u.match(PREFIX_RE);
  let ie = "", rest = u;
  if (m){ const p = m[1].replace(/\s/g,""); rest = u.slice(m[0].length);
    if (/\//.test(p)) ie = "I/E"; else if (/^(INT|INNEN|ІНТ)/.test(p)) ie = "INT"; else ie = "EXT"; }
  let parts = rest.split(/\s+[-–—]\s+/), time = "";
  if (parts.length > 1){ time = parts.pop().trim(); }
  const loc = parts.join(" - ").trim().replace(/\s*-\s*$/,"");
  let dn = DAYW.test(time) ? "G" : NIGHTW.test(time) ? "N" : "";
  return {ie, loc: loc || "—", time, dn};
}

/* ============ fountain / fdx ============ */
function parseFountain(src){
  src = String(src).replace(/\r\n?/g,"\n").replace(/\/\*[\s\S]*?\*\//g,"").replace(/\[\[[\s\S]*?\]\]/g,"");
  const lines = src.split("\n"); const tp = {}; let i = 0;
  if (/^(title|credit|author|authors|source|draft date|contact|copyright)\s*:/i.test(lines[0]||"")){
    let key = null;
    for (; i<lines.length; i++){
      const l = lines[i]; if (l.trim()==="") { i++; break; }
      const m = l.match(/^([A-Za-z ]+):\s*(.*)$/);
      if (m && !/^\s/.test(l)){ key = m[1].toLowerCase(); tp[key] = m[2].trim(); }
      else if (key){ tp[key] = (tp[key] ? tp[key]+"\n" : "") + l.trim(); }
    }
  }
  const out = []; let inDia = false;
  const prevBlank = j => j<=0 || lines[j-1].trim()==="";
  for (; i<lines.length; i++){
    const raw = lines[i], l = raw.trim();
    if (l===""){ inDia=false; continue; }
    if (/^(#|=(?!=))/.test(l)) continue;
    if (/^={3,}$/.test(l)) continue;
    if (inDia){
      if (/^\(.*\)$/.test(l)) out.push(["p",l]); else {
        const last = out[out.length-1];
        if (last && last[0]==="d" && !/^\(/.test(l)) last[1] += "\n"+l; else out.push(["d",l]);
      }
      continue;
    }
    if (/^\.[^.]/.test(l)){ out.push(["s",l.slice(1).trim()]); continue; }
    if (SCENE_RE.test(l) && prevBlank(i)){ out.push(["s",l.replace(/\s*#[^#]*#\s*$/,"")]); continue; }
    if (/^>.*<$/.test(l)){ out.push(["a",l.slice(1,-1).trim()]); continue; }
    if (/^>/.test(l)){ out.push(["t",l.slice(1).trim()]); continue; }
    if (isUpperLine(l) && /:$|^FADE /.test(l) && prevBlank(i)){ out.push(["t",l]); continue; }
    if (/^!/.test(l)){ pushAction(l.slice(1)); continue; }
    const next = lines[i+1]; const hasNext = next!==undefined && next.trim()!=="";
    if (/^@/.test(l) && hasNext){ out.push(["c",l.slice(1).replace(/\s*\^$/," ^").trim()]); inDia=true; continue; }
    if (isUpperLine(l) && prevBlank(i) && hasNext && !/[.:!?]$/.test(l.replace(/\([^)]*\)/g,"").trim()) ){ out.push(["c",l.replace(/\s*\^$/," ^")]); inDia=true; continue; }
    pushAction(raw.replace(/^\s{0,}/,""));
  }
  function pushAction(t){
    const last = out[out.length-1];
    if (last && last[0]==="a" && !prevBlank(i)) last[1] += "\n"+t; else out.push(["a",t]);
  }
  return {blocks: out, tp: {title: tp.title||"", credit: tp.credit||"", author: tp.author||tp.authors||"", source: tp.source||"", draft: tp["draft date"]||"", contact: tp.contact||""}};
}
function parseFDX(src){
  const doc = new DOMParser().parseFromString(src,"application/xml");
  const map = {"Scene Heading":"s","Action":"a","Character":"c","Parenthetical":"p","Dialogue":"d","Transition":"t","Shot":"h","General":"a"};
  const out = [];
  const one = (p, dualSecond) => {
    const t = map[p.getAttribute("Type")] || "a";
    let txt = ""; p.querySelectorAll(":scope > Text").forEach(n => txt += n.textContent);
    txt = txt.replace(/\s+$/,"");
    if (t==="c" && dualSecond) txt += " ^";
    if (txt || t!=="a") out.push([t, txt]);
  };
  doc.querySelectorAll("Content > Paragraph").forEach(p => {
    const dd = p.querySelector(":scope > DualDialogue");
    if (dd){ let nc = 0; dd.querySelectorAll(":scope > Paragraph").forEach(q => { if (q.getAttribute("Type")==="Character") nc++; one(q, nc===2); }); return; }
    one(p, false);
  });
  let title = "";
  const tpTexts = [...doc.querySelectorAll("TitlePage Paragraph")].map(p=>p.textContent.trim()).filter(Boolean);
  if (tpTexts.length) title = tpTexts[0];
  return {blocks: out, tp:{title}};
}
function toFountain(model, tp){
  const out = [];
  const keys = [["Title",tp.title],["Credit",tp.credit],["Author",tp.author],["Source",tp.source],["Draft date",tp.draft],["Contact",tp.contact]];
  keys.filter(k=>k[1]).forEach(([k,v]) => { if (v.includes("\n")){ out.push(k+":"); v.split("\n").forEach(x=>out.push("   "+x)); } else out.push(`${k}: ${v}`); });
  if (out.length) out.push("");
  model.forEach(([t, raw], i) => {
    const txt = String(raw).replace(/\s+$/,""); if (!txt) return;
    const nextT = (model[i+1]||[])[0];
    if (t==="s") out.push("", SCENE_RE.test(txt) ? txt.toUpperCase() : "."+txt.toUpperCase(), "");
    else if (t==="a" || t==="h"){ const x = t==="h" ? txt.toUpperCase() : txt; out.push(isUpperLine(x.split("\n")[0]) ? "!"+x : x, ""); }
    else if (t==="t"){ const u = txt.toUpperCase(); out.push(/TO:$/.test(u) ? u : "> "+u, ""); }
    else {
      if (t==="c") out.push(isUpperLine(txt) ? txt.toUpperCase() : "@"+txt);
      else if (t==="p") out.push(/^\(/.test(txt) ? txt : "("+txt+")");
      else out.push(txt);
      if (nextT!=="p" && nextT!=="d") out.push("");
    }
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim() + "\n";
}

/* ============ pagination (shared by editor marks, page count, eighths and PDF) ============ */
function wrap(text, width){
  const out = [];
  for (const para of String(text).split("\n")){
    if (para===""){ out.push(""); continue; }
    const words = para.split(/ +/); let line = "";
    for (let w of words){
      while (w.length > width){ if (line){ out.push(line); line=""; } out.push(w.slice(0,width)); w = w.slice(width); }
      if (!line) line = w; else if ((line+" "+w).length <= width) line += " "+w; else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}
function paginate(model, S){
  const LPP = S.paper==="Letter" ? 54 : 58;
  const [MORE, CONTD] = CONT[S.labels] || CONT.en;
  const units = []; let sceneNo = 0, lastSpk = null, curScene = "_pre";
  let i = 0;
  const L = (x,text,k,b,li,extra) => Object.assign({x,text,k,b,li},extra||{});
  while (i < model.length){
    const [t, txt, id] = model[i];
    if (!txt.trim() && t!=="s"){ i++; continue; }
    if (t==="c" || t==="p" || t==="d"){
      let head = null, base = null, dual = false; const items = [];
      if (t==="c"){
        let name = txt.trim().toUpperCase(); dual = /\^\s*$/.test(name); name = name.replace(/\s*\^\s*$/,""); base = charBase(name);
        if (S.contd && lastSpk===base && !/\((CONT|FORTS)/.test(name)) name += ` (${CONTD})`;
        head = L(22, name, "c", i, 0); lastSpk = base; i++;
      }
      const content = [];
      while (i<model.length && (model[i][0]==="p"||model[i][0]==="d")){
        const [tt, tx] = model[i];
        if (tx.trim()) items.push([tt, tx, i]);
        if (tx.trim()){ const w = tt==="p" ? wrap(tx.trim(),25) : wrap(tx.trim(),35);
          w.forEach((l,li) => content.push(L(tt==="p"?15:10, l, tt, i, li))); }
        i++;
      }
      const prevU = units[units.length-1];
      if (dual && head && prevU && prevU.kind==="speech" && prevU.head && !prevU.R){ prevU.kind = "dual"; prevU.R = {head, items}; continue; }
      units.push({kind:"speech", before:1, head, base, content, items, scene:curScene});
      continue;
    }
    if (t==="s"){
      sceneNo++; lastSpk = null; curScene = id || ("i"+i);
      if (SCN && id && SCN.omitBefore[id]) SCN.omitBefore[id].forEach(lb => units.push({kind:"scene", before:S.sceneSpace, lines:[L(0, OMIT[S.labels]||OMIT.en, "s", undefined, 0, {sn:lb, om:1})], scene:curScene}));
      const ls = wrap((txt.trim()||" ").toUpperCase(), 60).map((l,li) => L(0,l,"s",i,li, li===0?{sn:(SCN && id && SCN.lab[id]) || sceneNo}:null));
      units.push({kind:"scene", before:S.sceneSpace, lines:ls, scene:curScene});
    } else if (t==="t"){
      const ls = wrap(txt.trim().toUpperCase(),60).map((l,li)=>L(Math.max(0,60-l.length),l,"t",i,li));
      units.push({kind:"trans", before:1, lines:ls, scene:curScene});
    } else {
      const ls = wrap(t==="h"?txt.toUpperCase():txt, 60).map((l,li)=>L(0,l,t,i,li));
      units.push({kind: t==="h"?"scene":"action", before:1, lines:ls, scene:curScene});
    }
    i++;
  }
  if (SCN && SCN.omitEnd.length) SCN.omitEnd.forEach(lb => units.push({kind:"scene", before:S.sceneSpace, lines:[L(0, OMIT[S.labels]||OMIT.en, "s", undefined, 0, {sn:lb, om:1})], scene:curScene}));
  const pages = [[]]; let y = 0; const blockPage = {}; const sceneLines = {}; const pageStarts = [null];
  const put = (ln, sc) => {
    const p = pages.length-1; ln.row = y; pages[p].push(ln);
    if (pageStarts[p]===null) pageStarts[p] = {b: ln.b, li: ln.li};
    if (ln.b!==undefined && blockPage[ln.b]===undefined) blockPage[ln.b] = p;
    y++; sceneLines[sc] = (sceneLines[sc]||0) + 1;
  };
  const newPage = () => { pages.push([]); pageStarts.push(null); y = 0; };
  const space = (n, sc) => { if (y>0){ y += n; sceneLines[sc] = (sceneLines[sc]||0)+n; } };
  const dualCols = u => { const col = (uu, side) => { const cx = side ? 31 : 0, out = [];
      out.push(L(cx + 7, uu.head.text, "c", uu.head.b, 0));
      uu.items.forEach(([tt, tx, bi]) => (tt==="p" ? wrap(tx.trim(), 22) : wrap(tx.trim(), 28)).forEach((l, li) => out.push(L(cx + (tt==="p" ? 3 : 0), l, tt, bi, li))));
      return out; };
    return [col(u, 0), col(u.R, 1)]; };
  const ulen = u => u.kind==="dual" ? Math.max(...dualCols(u).map(c => c.length)) : u.kind==="speech" ? (u.head?1:0)+u.content.length : u.lines.length;
  for (let k=0; k<units.length; k++){
    const u = units[k], sc = u.scene;
    const sp = y===0 ? 0 : u.before;
    const len = ulen(u);
    if (u.kind==="scene"){
      const nx = units[k+1]; const need = sp + len + (nx ? nx.before + Math.min(2, ulen(nx)) : 0);
      if (y>0 && y+need > LPP) newPage();
      space(u.before, sc); u.lines.forEach(l=>put(l,sc)); continue;
    }
    if (u.kind==="trans"){
      if (y>0 && y+sp+len > LPP) newPage();
      space(u.before, sc); u.lines.forEach(l=>put(l,sc)); continue;
    }
    if (u.kind==="action"){
      if (y+sp+len <= LPP){ space(u.before, sc); u.lines.forEach(l=>put(l,sc)); continue; }
      let rest = u.lines.slice(); let rem = LPP - y - sp;
      if (y>0 && (rem < 2 || rest.length - rem < 2)){ newPage(); }
      else if (y>0){ space(u.before, sc); rest.splice(0,rem).forEach(l=>put(l,sc)); newPage(); }
      while (rest.length){ const chunk = rest.splice(0, LPP - y); chunk.forEach(l=>put(l,sc)); if (rest.length) newPage(); }
      continue;
    }
    if (u.kind==="dual"){
      const [Lc, Rc] = dualCols(u), n = Math.max(Lc.length, Rc.length);
      if (y>0 && y+sp+n > LPP) newPage();
      space(u.before, sc);
      for (let r=0; r<n; r++){ const parts = [Lc[r], Rc[r]].filter(Boolean); put({k:"dual", parts, b: parts[0].b, li: parts[0].li, x:0, text:""}, sc); }
      lastSpk = null; continue;
    }
    // speech
    if (y+sp+len <= LPP){ space(u.before, sc); if (u.head) put(u.head,sc); u.content.forEach(l=>put(l,sc)); continue; }
    let content = u.content.slice(); let head = u.head;
    let rem = LPP - y - sp; let avail = rem - (head?1:0) - 1;
    let kk = Math.min(avail, content.length-1);
    while (kk>0 && content[kk-1].k==="p") kk--;
    if (y>0 && (kk < 2 || content.length - kk < 1)) { newPage(); }
    else if (y>0){
      space(u.before, sc); if (head) put(head,sc);
      content.splice(0,kk).forEach(l=>put(l,sc));
      put({x:22,text:MORE,k:"more"}, sc); newPage();
      if (u.base) put({x:22,text:`${u.base} (${CONTD})`,k:"c"}, sc);
      head = null;
    }
    if (head) put(head, sc);
    while (content.length){
      const room = LPP - y - (content.length > LPP - y ? 1 : 0);
      const chunk = content.splice(0, Math.max(1,room)); chunk.forEach(l=>put(l,sc));
      if (content.length){ put({x:22,text:MORE,k:"more"},sc); newPage(); if (u.base) put({x:22,text:`${u.base} (${CONTD})`,k:"c"},sc); }
    }
  }
  if (pages.length>1 && pages[pages.length-1].length===0){ pages.pop(); pageStarts.pop(); }
  return {pages, blockPage, sceneLines, LPP, pageStarts};
}

function analyse(model, P){
  const scenes = []; let cur = null;
  model.forEach(([t, txt, id], i) => {
    if (t==="s"){ const h = parseHeading(txt); cur = {id: id||("i"+i), i, heading: txt.trim().toUpperCase(), ...h, speakers:{}, text:[], n: scenes.length+1}; scenes.push(cur); }
    else if (!cur && txt.trim()){ cur = {id:"_pre", i:0, heading:"—", ie:"", loc:"—", time:"", dn:"", speakers:{}, text:[], n:0}; scenes.push(cur); }
    if (!cur) return;
    if (t==="c"){ const b = charBase(txt); if (b) cur.speakers[b] = (cur.speakers[b]||0)+1; cur.lastSpk = b; }
    if (t!=="s" && txt.trim()) cur.text.push(t==="c" ? "\n"+txt.toUpperCase() : t==="d" ? txt : t==="p" ? txt : "\n"+txt);
  });
  const allNames = new Set(); scenes.forEach(s => Object.keys(s.speakers).forEach(n => allNames.add(n)));
  const LPP = P.LPP;
  scenes.forEach(s => {
    const body = s.text.join("\n");
    s.body = body;
    s.sig = hash(s.heading + "|" + body);
    s.e8 = Math.max(1, Math.round((P.sceneLines[s.id]||1) * 8 / LPP));
    s.page = (P.blockPage[s.i] ?? 0) + 1;
    const present = new Set(Object.keys(s.speakers));
    const actionText = body.toUpperCase();
    allNames.forEach(n => { if (!present.has(n) && n.length>1 && new RegExp("(^|[^A-ZÀ-ÞЀ-ЯҐЄІЇ])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^A-ZÀ-ÞЀ-ЯҐЄІЇ]|$)").test(actionText)) present.add(n); });
    s.cast = [...present];
  });
  return {scenes, names:[...allNames]};
}

function blockOf(node){ while (node && node!==ed){ if (node.parentNode===ed) return node; node = node.parentNode; } return null; }
function caret(){
  const sel = getSelection(); if (!sel.rangeCount) return null;
  const r = sel.getRangeAt(0); const el = blockOf(r.startContainer); if (!el) return null;
  const pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  const off = pre.toString().length;
  return {el, i: [...ed.children].indexOf(el), off, collapsed: r.collapsed, len: getText(el).length};
}
function setCaret(el, off){

    if (node.nodeType===3){ if (n + node.length >= off){ r.setStart(node, off-n); done = true; return; } n += node.length; }
    else node.childNodes.forEach(walk);

/* ============ history ============ */
function snap(){ return {m: readModel(), c: caretPos()}; }

  lastPushT = now;

/* ============ editing ============ */
function doEnter(){
  const sel = getSelection(); if (sel.rangeCount && !sel.isCollapsed){ document.execCommand("delete"); normalize(); }
  const c = caret(); if (!c) return;
  const el = c.el, t = el.dataset.t, txt = getText(el);
  if (!txt.trim() || (t==="p" && txt.trim()==="()")){
    const nt = t==="a" ? "s" : (t==="p" ? "d" : "a");
    setType(el, nt); setText(el, ""); setCaret(el, 0); return;
  }
  if (t==="a" && isUpperLine(txt.trim()) && /:$/.test(txt.trim())) setType(el, "t");
  if (c.off===0){ el.before(makeEl(el.dataset.t, "")); setCaret(el, 0); return; }
  const before = txt.slice(0, c.off), after = txt.slice(c.off);
  setText(el, before);
  const nt = NEXT[el.dataset.t] || "a";
  const n = makeEl(nt, after, nt==="s" ? uid() : "");
  el.after(n); setCaret(n, 0);

}
function merge(a, b){
  if (getText(a)===""){ a.remove(); setCaret(b, 0); return; }
  const la = getText(a).length; setText(a, getText(a) + getText(b)); b.remove(); setCaret(a, la);
}
function currentBlock(){ const c = caret(); if (c) return c; const el = ed.children[Math.min(lastCaret.i, ed.children.length-1)]; return el ? {el, i:lastCaret.i, off:Math.min(lastCaret.off, getText(el).length)} : null; }
function applyType(t){
  const c = currentBlock(); if (!c) return;
  pushHist(true);
  const el = c.el, old = el.dataset.t, txt = getText(el);
  let off = c.off;
  if (t==="p" && txt.trim()===""){ setText(el, "()"); off = 1; }
  else if (t==="p" && !/^\(/.test(txt.trim())){ setText(el, "("+txt.trim()+")"); off = txt.trim().length+1; }
  else if (old==="p" && t!=="p" && /^\(.*\)$/.test(txt.trim())){ const inner = txt.trim().slice(1,-1); setText(el, inner); off = Math.min(off, inner.length); }
  setType(el, t);
  if (!ed.contains(document.activeElement) && document.activeElement!==ed) ed.focus({preventScroll:true});
  setCaret(el, Math.min(off, getText(el).length));
  afterChange(); updateCurrent(); updateAC();
}
function autoDetect(){
  const c = caret(); if (!c) return;
  const el = c.el, t = el.dataset.t, txt = getText(el);
  if (t==="a" && SCENE_RE.test(txt) && txt.length<=9 && !txt.includes("\n")){ setType(el, "s"); setCaret(el, c.off); }
  else if (t==="d" && txt==="("){ setType(el, "p"); setText(el, "()"); setCaret(el, 1); }
}

ed.addEventListener("beforeinput", e => {

    }

    }

        if (c.el.dataset.t!=="a" && !getText(c.el)){ e.preventDefault(); pushHist(true); setType(c.el,"a"); afterChange(); updateCurrent(); return; }

function suggestions(el){

  if (t==="s"){
    const m = u.match(PREFIX_RE);
    const PREFIXES = SLang().prefixes, TIMES = SLang().times;

function lineCharOffset(el, li){

const CHUNK = 60000;
const LocalStore = {
  get label(){ return T("Salvato su questo dispositivo"); },
  async list(){ try{ return JSON.parse(lsGet("abt:index")||"[]"); }catch(e){ return []; } },
  async load(id){ const raw = lsGet("abt:s:"+id); if (!raw) return null; return JSON.parse(raw); },
  async save(doc){
    const ok = lsSet("abt:s:"+doc.id, JSON.stringify(doc));
    const idx = (await this.list()).filter(x=>x.id!==doc.id); idx.unshift({id:doc.id, title:doc.title, updated:doc.updated});
    lsSet("abt:index", JSON.stringify(idx));
    if (!ok) throw {code:"local_full", message:"Spazio locale esaurito"};
  },
  async remove(id){ lsDel("abt:s:"+id); const idx = (await this.list()).filter(x=>x.id!==id); lsSet("abt:index", JSON.stringify(idx)); }
};
function makeDBStore(db, userId){
  const col = db.collection("data/users/"+userId);
  return {
    get label(){ return T("Salvato nel cloud"); },
    async list(){
      const q = await col.where("kind","==","meta").get();
      return q.docs.map(d => d.data()).map(d => ({id:d.sid, title:d.title, updated:d.updated})).sort((a,b)=>b.updated-a.updated);
    },
    async load(id){
      const m = await col.doc("m_"+id).get(); if (!m.exists) return null;
      const meta = m.data(); let body = "";
      for (let k=0; k<(meta.parts||1); k++){ const p = await col.doc(`s_${id}_${k}`).get(); if (p.exists) body += p.data().body || ""; }
      const b = await col.doc("b_"+id).get();
      let xo = {}; if (meta.xparts){ let xs = ""; for (let k=0; k<meta.xparts; k++){ const p = await col.doc(`x_${id}_${k}`).get(); if (p.exists) xs += p.data().body || ""; } try{ xo = JSON.parse(xs||"{}"); }catch(e){} }
      return {x: xo.x || null, xb: xo.xb || {}, xparts: meta.xparts || 0, id, title: meta.title, titlePage: JSON.parse(meta.titlePage||"{}"), settings: JSON.parse(meta.settings||"{}"),
        created: meta.created, updated: meta.updated, body: JSON.parse(body||"[]"), breakdown: b.exists ? JSON.parse(b.data().data||"{}") : {}};
    },
    async save(doc){
      const body = JSON.stringify(doc.body); const parts = Math.max(1, Math.ceil(body.length / CHUNK));
      for (let k=0; k<parts; k++) await col.doc(`s_${doc.id}_${k}`).set({kind:"part", sid:doc.id, body: body.slice(k*CHUNK, (k+1)*CHUNK)});
      for (let k=parts; k<(doc.prevParts||0); k++){ try{ await col.doc(`s_${doc.id}_${k}`).delete(); }catch(e){} }
      await col.doc("b_"+doc.id).set({kind:"bd", sid:doc.id, data: JSON.stringify(doc.breakdown||{})});
      let xparts = doc.xparts || 0;
      if (doc.xSave){ const xs = JSON.stringify({x: doc.x, xb: doc.xb}); const n = Math.max(1, Math.ceil(xs.length / CHUNK));
        for (let k=0; k<n; k++) await col.doc(`x_${doc.id}_${k}`).set({kind:"xpart", sid:doc.id, body: xs.slice(k*CHUNK, (k+1)*CHUNK)});
        for (let k=n; k<xparts; k++){ try{ await col.doc(`x_${doc.id}_${k}`).delete(); }catch(e){} }
        xparts = n; }
      doc.xparts = xparts;
      await col.doc("m_"+doc.id).set({kind:"meta", sid:doc.id, title:doc.title, updated:doc.updated, created:doc.created||doc.updated, by: DEVICE,
        parts, xparts, titlePage: JSON.stringify(doc.titlePage||{}), settings: JSON.stringify(doc.settings||{})});
      return parts;
    },
    watch(id, cb){ return col.doc("m_"+id).onSnapshot(sn => { if (sn.exists && !sn.metadata.hasPendingWrites) cb(sn.data()); }, () => {}); },
    async remove(id){
      const m = await col.doc("m_"+id).get(); const parts = m.exists ? (m.data().parts||1) : 1;
      await col.doc("m_"+id).delete().catch(()=>{});
      for (let k=0;k<parts;k++) await col.doc(`s_${id}_${k}`).delete().catch(()=>{});
      await col.doc("b_"+id).delete().catch(()=>{});
      for (let k=0;k<((m.exists && m.data().xparts)||0);k++) await col.doc(`x_${id}_${k}`).delete().catch(()=>{});
    }
  };
}

const saveSoonSlow = debounce(() => saveNow(), 1500);
let liveSaveT = null;
/* shared scripts: send while typing (about 4 times a second) instead of waiting for a pause */
function saveSoon(){
  if (cur && cur.shared && typeof ONLINE!=="undefined" && ONLINE){
    if (liveSaveT) return;
    liveSaveT = setTimeout(() => { liveSaveT = null; saveNow(); }, 150);
  } else saveSoonSlow();
}
let saving = null, saveAgain = false;
async function saveNow(){
  if (!cur || cur.isSample || readOnly) return;
  if (!Store){ setTimeout(saveNow, 1000); return; }
  if (saving){ saveAgain = true; return saving; }
  const doc = {id: cur.id, title: cur.title || T("Senza titolo"), titlePage: cur.titlePage, settings: S, breakdown: cur.breakdown,
    created: cur.created, updated: Date.now(), body: readModel(), prevParts: cur.parts||0,
    x: cur.x || null, xb: cur.xb || {}, xparts: cur.xparts || 0, xSave: !!cur.xDirty};
  const hadX = !!cur.xDirty;
  setSaveStatus(T("Salvataggio…"), "busy");
  saving = (async () => {
    try{
      if (cur.shared){
        await saveShared(doc);
        if (!ONLINE){ setSaveStatus(T("Offline · le modifiche partono quando torni online"), "busy"); saving = null; return; }
        dirty = jstr(readModel())!==jstr(shBase); lastSaved = new Date();
        setSaveStatus(`${T("Salvato · copione condiviso")} · ${lastSaved.toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"})}`, "");
        if (dirty) saveSoon();
      } else {
      const parts = await Store.save(doc); if (parts) cur.parts = parts; cur.updated = doc.updated;
      if (doc.xparts) cur.xparts = doc.xparts; if (hadX) cur.xDirty = false;
      if (!unwatch) watchCurrent();
      if (Store!==LocalStore){ try{ lsSet("abt:backup:"+doc.id, JSON.stringify(doc)); }catch(e){} }
      dirty = false; lastSaved = new Date();
      setSaveStatus(`${Store.label} · ${lastSaved.toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"})}`, Store===LocalStore?"local":"");
      lsSet("abt:last", cur.id);
      }
    }catch(err){
      setSaveStatus(T("Salvataggio non riuscito: riprovo tra poco"), "err");
      lsSet("abt:backup:"+doc.id, JSON.stringify(doc));
      setTimeout(()=>{ if (dirty) saveNow(); }, 8000);
    }
  })();
  await saving; saving = null;
  if (saveAgain){ saveAgain = false; return saveNow(); }
}

function loadDoc(doc){

/* three-way merge on blocks: base = last synced, local = this screen, remote = store */
function merge3(base, local, remote){
  const B = new Map(base.map(r => [r[2], r])), L = new Map(local.map(r => [r[2], r])), Rm = new Map(remote.map(r => [r[2], r]));
  const out = [];
  for (const r of remote){
    const id = r[2], b = B.get(id), l = L.get(id);
    if (l){ out.push(b && !sameRow(l, b) ? l : r); continue; }
    if (b && sameRow(r, b)) continue;
    out.push(r);
  }
  const have = new Set(out.map(r => r[2]));
  local.forEach((l, i) => {
    if (have.has(l[2])) return;
    const b = B.get(l[2]);
    if (b && !Rm.has(l[2]) && sameRow(l, b)) return;
    let pos = 0;
    for (let j=i-1; j>=0; j--){ const k = out.findIndex(x => x[2]===local[j][2]); if (k>=0){ pos = k+1; break; } }
    out.splice(pos, 0, l); have.add(l[2]);
  });
  return out;
}
function applyModel(m){

  const nodes = m.map(([t,x,id]) => {

    if (el){ if (el.dataset.t!==t) setType(el, t); if (getText(el)!==x) setText(el, x); existing.delete(id); return el; }

/* order keys: keep existing ones that are increasing, give new blocks a key between their neighbours */
function assignKeys(list){
  const keys = list.map(r => { const v = remoteMap.get(r[2]); return v ? v.k : null; });
  let prev = -Infinity, changed = new Set(), ok = true;
  for (let i=0; i<list.length; i++){
    if (keys[i]!==null && keys[i] > prev){ prev = keys[i]; continue; }
    let next = null; for (let j=i+1; j<list.length; j++){ if (keys[j]!==null && keys[j] > prev){ next = keys[j]; break; } }
    const lo = prev===-Infinity ? (next!==null ? next - 1024 : 0) : prev;
    const k = next===null ? lo + 1024 : (lo + next) / 2;
    if (next!==null && (next - lo) < 1e-6) ok = false;
    keys[i] = k; prev = k; changed.add(list[i][2]);
  }
  if (!ok){ list.forEach((r,i) => { keys[i] = (i+1)*1024; changed.add(r[2]); }); }

}

    ONLINE = false;
    remoteMap = new Map(cache.base.map((r,i) => [r[2], {t:r[0], x:r[1], k:(i+1)*1024}]));
    base = cache.base; body = cache.local; bd = cache.breakdown || {};
    meta = {title: cache.title, titlePage: jstr(cache.titlePage||{}), settings: jstr(cache.settings||{}), xc: cache.x || null};
  } else {
    const blocks = (await RT.get(`p/${pid}/b`)) || {};
    remoteMap = new Map(Object.entries(blocks));
    try{ bd = JSON.parse((await RT.get(`p/${pid}/bd`)) || "{}"); }catch(e){}
    base = remoteList(); body = base;
    if (cache && cache.pid===pid && jstr(cache.local)!==jstr(cache.base)){ body = merge3(cache.base, cache.local, base); }
  }
  IS_OWNER = !!(known && known.own);
  loadDoc({id:"sh_"+sid, shared:sid, title:meta.title, titlePage:JSON.parse(meta.titlePage||"{}"), settings:JSON.parse(meta.settings||"{}"), created:meta.created, updated:meta.updated, body, breakdown:bd});
  shBase = base; histCur = null;
  if (meta.xc){ cur.x = meta.xc; ensureRevBase(); } else applySharedX(meta);
  if (jstr(body)!==jstr(base)){ dirty = true; if (!offline) saveSoon(); }
  writeCache();
  saveProject({sid, pw, title: meta.title, updated: meta.updated || Date.now(), byName: meta.byName || "", own: !!(known && known.own)});
  try{ if (location.hash!=="#c-"+sid) history.replaceState(null, "", location.pathname + location.search + "#c-" + sid); }catch(e){}
  setReadOnly(false);
  shUnwatch = RT.onChildren(`p/${pid}/b`, {
    added: (k,v) => { const o = remoteMap.get(k); if (!o || o.t!==v.t || o.x!==v.x || o.k!==v.k){ remoteMap.set(k, v); scheduleApply(); } },
    changed: (k,v) => { remoteMap.set(k, v); scheduleApply(); },
    removed: k => { if (remoteMap.has(k)){ remoteMap.delete(k); scheduleApply(); } }
  });
  const metaOff = RT.onValue(`p/${pid}/m`, m => {
    if (!m || !cur || cur.shared!==sid) return;
    if (document.activeElement!==$("#title") && m.title && m.title!==cur.title){ cur.title = m.title; $("#title").value = m.title; }
    try{ const st = JSON.parse(m.settings||"{}"); if (jstr(st)!==jstr(S)){ const keep = S.lang; S = {...DEF_SETTINGS, ...st}; applySettings(); if (S.lang!==keep) runTick(); } }catch(e){}
    if (m.byName && m.byName!==myName()) setSaveStatus(T("Aggiornato da {n}",{n:m.byName}), "");
    applySharedX(m);
  });
  const prevUnwatch = shUnwatch; shUnwatch = () => { prevUnwatch(); metaOff(); };
  renderShareBar();
  await askName();
  joinRoom();
  setSaveStatus(offline ? T("Offline · le modifiche partono quando torni online") : T("Copione condiviso · salvataggio automatico"), offline ? "busy" : "");
}
function closeShared(){
  if (shUnwatch){ try{ shUnwatch(); }catch(e){} shUnwatch = null; }
  leaveRoom(); PID = null; remoteMap = new Map(); IS_OWNER = false;
}
function leaveShared(){
  closeShared(); setReadOnly(false);
  try{ if (/^#c-/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search); }catch(e){}
}

async function makeShared(){
  if (!DB){ toast(T("Il salvataggio condiviso non è ancora configurato.")); return; }
  if (cur.shared){ showShare(); return; }
  if (!(await ensureAuthor())) return;
  await askName();
  const pw = await new Promise(resolve => {
    overlay(`<div class="modal" role="dialog" aria-label="${T("Condividi il copione")}"><h3>${T("Condividi il copione")}</h3>
      <div class="field"><label for="newPw">${T("Parola d'ordine (facoltativa)")}</label><input id="newPw" autocomplete="off" placeholder="${T("Lascia vuoto per entrare solo con il link")}"></div>
      <p class="empty-note" style="padding:0 0 4px">${T("Se la metti, mandala a parte rispetto al link: senza, nessuno trova il copione.")}</p>
      <div class="row"><button class="btn" data-no>${T("Annulla")}</button><button class="btn primary" data-ok>${T("Condividi")}</button></div></div>`);
    $("#overlay .modal [data-ok]").onclick = () => { const v = $("#newPw").value; closeOverlay(); resolve(v); };
    $("#overlay .modal [data-no]").onclick = () => { closeOverlay(); resolve(null); };
  });
  if (pw===null) return;
  const sid = (uid() + uid()).replace(/[^a-z0-9]/g, "").slice(0, 20);
  const pid = await pidFor(sid, pw);
  const body = readModel();
  const {keys} = (remoteMap = new Map(), assignKeys(body));
  const up = {};
  body.forEach((r,i) => { up[`p/${pid}/b/${r[2]}`] = {t:r[0], x:r[1], k:keys[i]}; });
  up[`p/${pid}/m`] = {title: cur.title || T("Senza titolo"), titlePage: jstr(cur.titlePage||{}), settings: jstr(S), created: Date.now(), updated: Date.now(), byName: myName(), v: 1};
  up[`p/${pid}/bd`] = jstr(cur.breakdown||{});
  const hid = Date.now().toString(36) + "-start";
  up[`p/${pid}/h/${hid}`] = {at: Date.now(), start: Date.now(), name: myName(), added: 0, removed: 0, scenes: [], label: "shared"};
  up[`p/${pid}/s/${hid}`] = jstr(body);
  setSaveStatus(T("Salvataggio…"), "busy");
  try{
    await withTimeout(RT.update(up), 15000);
    saveProject({sid, pw, title: cur.title, updated: Date.now(), byName: myName(), own: true});
    const oldId = cur.isSample ? null : cur.id;
    dirty = false;
    if (oldId && Store){ try{ await Store.remove(oldId); }catch(e){} }
    await openShared(sid);
    showShare(true);
  }catch(e){ console.error(e); setSaveStatus(T("Salvataggio non riuscito: riprovo tra poco"), "err"); toast(T("Non sono riuscito a condividere il copione. Riprova.")); }
}
function showShare(first){
  const p = projOf(cur.shared) || {};
  const link = location.origin + location.pathname + "#c-" + cur.shared;
  overlay(`<div class="modal" role="dialog" aria-label="${T("Condividi il copione")}"><h3>${T("Condividi il copione")}</h3>
    ${first ? `<p class="empty-note" style="padding:0 0 10px">${T("Fatto: ora questo copione è condiviso.")}</p>` : ""}
    <div class="field"><label for="shLink">${T("Link del copione")}</label><input id="shLink" readonly value="${esc(link)}"></div>
    ${p.pw ? `<div class="field"><label for="shPw">${T("Parola d'ordine")}</label><input id="shPw" readonly value="${esc(p.pw)}"></div>` : ""}
    <div class="row" style="justify-content:flex-start;margin:0 0 14px"><button class="btn primary" data-copy>${T("Copia link")}</button></div>
    <ol class="steps">
      <li>${T("Manda il link alla persona.")}</li>
      ${p.pw ? `<li>${T("Mandale la parola d'ordine a parte, per esempio in un altro messaggio.")}</li>` : ""}
      <li>${T("Chi apre il link scrive il suo nome e può modificare subito, senza account. Ogni modifica finisce nella cronologia con il suo nome.")}</li>
    </ol>
    <p class="empty-note" style="padding:8px 0 0">${T("Chi ha il link può modificare tutto: mandalo solo a chi lavora al copione. Dalla cronologia puoi sempre tornare a una versione precedente.")}</p>
    <div class="row"><button class="btn" data-close>${T("Chiudi")}</button></div></div>`);
  $("#overlay .modal [data-close]").onclick = closeOverlay;
  $("#overlay .modal [data-copy]").onclick = async () => {
    const i = $("#shLink");
    try{ await navigator.clipboard.writeText(link); toast(T("Link copiato.")); }catch(e){ i.focus(); i.select(); toast(T("Seleziona il link e copialo.")); }
  };
}
async function showHistory(){
  if (!cur || !cur.shared || !PID) return;
  const pid = PID;
  overlay(`<div class="modal wide" role="dialog" aria-label="${T("Cronologia delle modifiche")}"><h3>${T("Cronologia delle modifiche")}</h3><div id="histList"><p class="empty-note">${T("Caricamento…")}</p></div><div class="row"><button class="btn" data-close>${T("Chiudi")}</button></div></div>`);
  $("#overlay .modal [data-close]").onclick = closeOverlay;
  let items = [];
  try{ const h = (await RT.get(`p/${pid}/h`)) || {}; items = Object.entries(h).map(([id,v]) => ({id, ...v})).sort((a,b) => (b.at||0) - (a.at||0)).slice(0, 300); }catch(e){}
  const box = $("#histList"); if (!box) return;
  if (!items.length){ box.innerHTML = `<p class="empty-note">${T("Nessuna modifica registrata finora.")}</p>`; return; }
  const fmt = t => new Date(t).toLocaleString(LOCALE(), {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  box.innerHTML = `<ul class="hist">${items.map(h => {
    const what = h.label==="shared" ? T("ha condiviso il copione") : h.label==="restore" ? T("ha ripristinato una versione precedente") :
      [h.added ? `+${h.added} ${T("parole")}` : "", h.removed ? `−${h.removed} ${T("parole")}` : "", (h.scenes||[]).length ? `${T("scene")} ${(h.scenes||[]).join(", ")}` : ""].filter(Boolean).join(" · ") || T("modifiche di formato");
    return `<li><div class="h-main"><b>${esc(h.name||"?")}</b><span>${esc(what)}</span><small>${esc(fmt(h.start||h.at))}${h.start && h.at - h.start > 60000 ? " – " + esc(new Date(h.at).toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"})) : ""}</small></div>
      <button class="btn" data-restore="${esc(h.id)}">${T("Ripristina")}</button></li>`;
  }).join("")}</ul><p class="empty-note" style="padding:10px 0 0">${T("Ogni riga raccoglie le modifiche di una persona in un arco di 10 minuti. Ripristinare crea una nuova voce: non si perde niente.")}</p>`;
  box.addEventListener("click", async e => {
    const b = e.target.closest("[data-restore]"); if (!b) return;
    if (b.dataset.confirm!=="1"){ b.dataset.confirm = "1"; b.textContent = T("Conferma"); return; }
    let snapS = null; try{ snapS = await RT.get(`p/${pid}/s/${b.dataset.restore}`); }catch(err){}
    if (!snapS){ toast(T("Per questa voce non c'è una copia salvata: scegli una riga vicina.")); return; }
    let body; try{ body = JSON.parse(snapS); }catch(err){ return; }
    closeOverlay();
    pushHist(true);
    const before = readModel();
    renderModel(body); lastSnap = snap(); runTick();
    const doc = {title: cur.title, titlePage: cur.titlePage, settings: S, breakdown: cur.breakdown, body: readModel()};
    await saveShared(doc);
    dirty = false;
    await recordHistory(cur.shared, before, doc.body, "restore");
    toast(T("Versione ripristinata."));
  });
}
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#c-([a-z0-9]+)$/); if (m && (!cur || cur.shared!==m[1])) openShared(m[1]); });


function watchConnection(){
  if (!RT.onConnected) return;
  let wasOnline = true, firstEvt = true;
  RT.onConnected(on => {
    ONLINE = on;
    if (firstEvt){ firstEvt = false; if (on) return; }
    if (on && !wasOnline){ resyncAfterReconnect(); if (cur && cur.shared) setSaveStatus(T("Di nuovo online · modifiche inviate"), ""); }
    if (!on && cur && cur.shared) setSaveStatus(T("Offline · le modifiche partono quando torni online"), "busy");
    wasOnline = on; renderShareBar();
  });
}
